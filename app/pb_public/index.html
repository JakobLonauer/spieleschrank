/* ---------- Kalender: Abholtag plus ein bis drei Rückgabetage innerhalb von drei Wochen ---------- */
/* Rollendes Raster aus fünf Wochen statt Monatsblättern: Abholtag plus drei Wochen passen immer auf einen Blick,
   auch über ein Monatsende hinweg. */
const WEEKS = 5, DAYS_AHEAD = 120;
const startDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const MSHORT = new Intl.DateTimeFormat('de-AT', { month: 'short' });
const MLONG = new Intl.DateTimeFormat('de-AT', { month: 'long' });
function rangeLabel(a, b) {
  if (a.getMonth() === b.getMonth()) return MF.format(a);
  if (a.getFullYear() === b.getFullYear()) return `${MLONG.format(a)} und ${MF.format(b)}`;
  return `${MF.format(a)} und ${MF.format(b)}`;
}
/* Nach der Wahl des Abholtags rückt das Raster nach, falls der erlaubte Zeitraum sonst nicht ganz sichtbar wäre */
function fitAnchor(F) {
  const start = F.fixedStart ? T0 : F.start; if (!start) return;
  const last = addDays(F.anchor, WEEKS * 7 - 1), lim = calLimit(F);
  if (start < F.anchor || (lim && lim > last)) F.anchor = mondayOf(start);
}
function calLimit(F) {
  const start = F.fixedStart ? T0 : F.start; if (!start) return null;
  let lim = addDays(start, MAXDAYS);
  const nb = (F.busy || []).map(r => startDay(r[0])).filter(a => a > start).sort((a, b) => a - b)[0];
  if (nb && addDays(nb, -1) < lim) lim = addDays(nb, -1);
  return lim;
}
const inBusy = (F, d) => (F.busy || []).some(([a, b]) => d >= startDay(a) && d <= startDay(b));
/* Warum ein Tag nicht geht: wird beim Antippen eines gesperrten Tages angezeigt */
function dayReason(F, d) {
  const start = F.fixedStart ? T0 : F.start;
  if (d < T0) return 'Dieser Tag ist schon vorbei.';
  if (inBusy(F, d)) return 'An diesem Tag ist es schon vergeben.';
  if (F.fixedStart && same(d, start)) return 'Es geht heute los. Tipp auf die Rückgabetage.';
  const lim = calLimit(F);
  if (start && lim && d > lim) return lim < addDays(start, MAXDAYS) ? `Ab ${fdw(addDays(lim, 1))} ist es schon wieder vergeben.` : 'Höchstens drei Wochen ab dem Abholtag.';
  return 'Dieser Tag geht leider nicht.';
}
function dayState(F, d) {
  const start = F.fixedStart ? T0 : F.start, past = d < T0, busy = inBusy(F, d);
  const isStart = same(d, start), isRet = (F.ret || []).some(r => same(r, d));
  let enabled;
  if (!start) enabled = !past && !busy;
  else if (F.fixedStart) enabled = d > start && d <= calLimit(F);
  else if (isStart) enabled = true;
  else if (d < start) enabled = !past && !busy;
  else enabled = d <= calLimit(F);
  return { busy, isStart, isRet, enabled };
}
function calStep(F) {
  const n = (F.ret || []).length;
  if (!F.fixedStart && !F.start) return F.who === 'member' ? 'Tipp auf den Tag, ab dem du es brauchst.' : 'Tipp auf den Tag, ab dem es verliehen ist.';
  if (n === 0) return F.who === 'member' ? 'Jetzt bis zu drei Tage antippen, an denen du es zurückbringen kannst.' : 'Jetzt bis zu drei mögliche Rückgabetage antippen.';
  if (n < 3) return `Du kannst noch ${n === 2 ? 'einen Tag' : 'zwei Tage'} dazunehmen. Musst du aber nicht.`;
  return 'Drei Rückgabetage gewählt.';
}
function calSum(F) {
  const start = F.fixedStart ? T0 : F.start; if (!start) return '';
  const r = F.ret || [], ds = r.length ? `<b>${esc(listDates(r))}</b>` : '';
  let text;
  if (F.who === 'member') text = `Du holst es ab <b>${esc(fdw(start))}</b>${r.length ? ` und bringst es am ${ds} zurück` : ''}.`;
  else if (F.fixedStart) text = `Ab heute verliehen${r.length ? `, zurück am ${ds}` : ''}.`;
  else text = `Ab <b>${esc(fdw(start))}</b>${r.length ? `, zurück am ${ds}` : ''}.`;
  return `<div class="cal-sum"><span>${tidy(text).replace(/\.<\/b>\./g, '.</b>')}</span>${!F.fixedStart ? `<button class="link" id="cal-reset" data-act="cal-reset">Anderen Abholtag wählen</button>` : ''}</div>`;
}
function calHTML(F) {
  const start = F.fixedStart ? T0 : F.start, lastRet = F.ret?.length ? maxD(F.ret) : null;
  const days = Array.from({ length: WEEKS * 7 }, (_, i) => addDays(F.anchor, i));
  const states = days.map(d => dayState(F, d));
  let fi = days.findIndex(d => same(d, F.focus));
  if (fi < 0) fi = days.findIndex((d, i) => same(d, start) && states[i].enabled);
  if (fi < 0) fi = states.findIndex(s => s.enabled);
  let cells = '';
  days.forEach((d, i) => {
    const s = states[i], inR = start && lastRet && d >= startDay(start) && d <= lastRet;
    const cls = ['cal-day', s.isStart && 'is-start', s.isRet && 'is-ret', s.busy && 'is-busy', same(d, T0) && 'is-today', inR && 'in-range', inR && same(d, start) && 'range-start', inR && same(d, lastRet) && 'range-end'].filter(Boolean).join(' ');
    const lab = `${fdl(d)}${s.isStart ? (F.fixedStart ? ', heute' : ', Abholtag') : ''}${s.isRet ? ', Rückgabetag' : ''}${s.busy ? ', schon vergeben' : ''}${s.enabled ? '' : ', nicht wählbar'}`;
    const firstOfM = d.getDate() === 1;
    cells += `<button class="${cls}${firstOfM ? ' m1' : ''}" id="cd-${isoD(d)}" data-act="cal-pick" data-d="${isoD(d)}" aria-label="${esc(lab)}" aria-pressed="${s.isStart || s.isRet}" tabindex="${i === fi ? 0 : -1}" ${s.enabled ? '' : 'aria-disabled="true"'}><span>${d.getDate()}${firstOfM ? `<small>${esc(MSHORT.format(d))}</small>` : ''}</span></button>`;
  });
  const canPrev = F.anchor > mondayOf(T0), canNext = dnum(addDays(F.anchor, 28)) <= DAYS_AHEAD;
  return `<div class="cal" id="cal">
    <p class="cal-step" id="cal-step" aria-live="polite">${esc(calStep(F))}</p>
    <div class="cal-head"><button class="icon-btn" id="cal-prev" data-act="cal-prev" aria-label="Frühere Wochen" ${canPrev ? '' : 'disabled'}>${ic('back')}</button><p class="cal-month" id="cal-month">${esc(rangeLabel(days[0] < T0 ? T0 : days[0], days[days.length - 1]))}</p><button class="icon-btn" id="cal-next" data-act="cal-next" aria-label="Spätere Wochen" ${canNext ? '' : 'disabled'}>${ic('next')}</button></div>
    <div class="cal-week" aria-hidden="true">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cal-grid" role="group" aria-labelledby="cal-month">${cells}</div>
    <div class="cal-legend" aria-hidden="true"><span><i class="lg-start"></i>${F.fixedStart ? 'Heute' : 'Abholtag'}</span><span><i class="lg-ret"></i>Rückgabetag</span>${(F.busy || []).length ? '<span><i class="lg-busy"></i>Schon vergeben</span>' : ''}</div>
    ${F.calWarn || F.calInfo ? `<p class="cal-hint info" id="cal-info" role="status">${ic('info')}<span>${esc(F.calWarn || F.calInfo)}</span></p>` : ''}
    ${F.err ? `<p class="err" id="cal-err" role="alert">${esc(F.err)}</p>` : ''}
    ${calSum(F)}
  </div>`;
}
const calForm = (o = {}) => ({ who: 'member', start: null, ret: [], anchor: mondayOf(o.start && o.start > T0 ? o.start : T0), busy: [], extras: [], msg: '', focus: null, calWarn: null, err: null, ...o });
function extrasHTML(g, F) {

  }).join('')}</div></fieldset>`;
}

  }).join('')}</ul><p class="bgg-note" style="margin-top:12px">Daten von BoardGameGeek</p>`;
}
let bggTimer = null, bggSeq = 0;
function bggSearch(q) {
  S.bgg.q = q; S.bgg.error = null;
  clearTimeout(bggTimer);
  if (q.trim().length < 2) { S.bgg.loading = false; S.bgg.results = null; paintBgg(); return; }
  S.bgg.loading = true; paintBgg();
  const seq = ++bggSeq;
  bggTimer = setTimeout(async () => {
    try {
      const d = await pb.send('/api/bgg/search', { method: 'GET', query: { q: q.trim() } });
      if (seq !== bggSeq) return;
      S.bgg.results = d.items;
    } catch (e) { if (seq !== bggSeq) return; S.bgg.results = null; S.bgg.error = serverMsg(e); }
    S.bgg.loading = false; paintBgg();
  }, 450);
}

/* Sammlung aus dem BGG-Export (collection.csv) übernehmen */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}
function bggRowsFrom(text) {
  const recs = parseCSV(text);
  if (!recs.length || !('objectid' in recs[0])) return null;
  const owned = new Set(S.games.filter(g => g.bggId).map(g => +g.bggId));
  const rows = recs.filter(r => r.own === '1' || r.own === undefined).map(r => ({
    bggId: +r.objectid, title: r.objectname || r.originalname, kind: /expansion/i.test(r.itemtype || r.objecttype || '') ? 'exp' : 'game',
    pmin: r.minplayers, pmax: r.maxplayers, tmin: r.minplaytime || r.playingtime, tmax: r.maxplaytime || r.playingtime,
    age: (r.bggrecagerange || '').match(/\d+/)?.[0] || '', weight: r.avgweight || r.weight
  })).filter(r => r.bggId > 0);
  return { rows, fresh: rows.filter(r => !owned.has(r.bggId)) };
}

/* ---------- Popover ---------- */
const pop = $('#pop');
function openPop(html, anchor, label, align = 'start') {
  if (S.popAnchor === anchor && !pop.hidden) { closePop(true); return; }
  closePop(false);
  pop.innerHTML = html; pop.hidden = false; pop.setAttribute('aria-label', label);
  S.popAnchor = anchor; anchor.setAttribute('aria-expanded', 'true');
  const r = anchor.getBoundingClientRect(), vw = document.documentElement.clientWidth, pw = pop.offsetWidth;
  let left = align === 'end' ? r.right - pw : r.left;
  left = Math.max(12, Math.min(left, vw - pw - 12));
  pop.style.left = `${left + scrollX}px`; pop.style.top = `${r.bottom + scrollY + 8}px`;
  pop.style.transformOrigin = align === 'end' ? 'top right' : 'top left';
  pop.classList.remove('in'); void pop.offsetWidth; pop.classList.add('in');
  (pop.querySelector('[aria-pressed="true"]') || pop.querySelector('button'))?.focus({ preventScroll: true });
}
function closePop(returnFocus) {
  if (pop.hidden) return;
  pop.hidden = true;
  const a = S.popAnchor; S.popAnchor = null;
  if (a && document.contains(a)) { a.setAttribute('aria-expanded', 'false'); if (returnFocus) a.focus({ preventScroll: true }); }
}

/* ---------- Hinweis mit Rückgängig ---------- */
let toastTimer = null;
function toast(msg, action) {
  const box = $('#toasts');
  box.innerHTML = `<div class="toast" role="status"><span>${esc(tidy(msg))}</span>${action ? `<button class="toast-act" id="toast-act">${esc(action.label)}</button>` : ''}</div>`;
  const el = box.querySelector('.toast');
  if (action) $('#toast-act').addEventListener('click', () => { action.run(); hideToast(); schedulePersist(); });
  const arm = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); };
  /* Hinweis bleibt stehen, solange man darauf zeigt oder ihn per Tastatur ansteuert */
  el.addEventListener('mouseenter', () => clearTimeout(toastTimer));
  el.addEventListener('mouseleave', () => arm(2500));
  el.addEventListener('focusin', () => clearTimeout(toastTimer));
  el.addEventListener('focusout', () => arm(2500));
  arm(action ? 6000 : 3200);
}
function hideToast() { const t = $('#toasts .toast'); if (!t) return; t.classList.add('out'); setTimeout(() => t.remove(), 200); }
const undoable = (obj, msg, extra) => { const snap = { ...obj, ret: obj.ret ? [...obj.ret] : obj.ret, extras: obj.extras ? [...obj.extras] : obj.extras }; toast(msg, { label: 'Rückgängig', run: () => { Object.assign(obj, snap); if (extra) extra(); refresh(); } }); };

/* ---------- Helfer für Aktionen ---------- */
async function shrink(file, max = 1600) {
  /* Neu kodieren über ein Canvas: verkleinert und entfernt dabei Metadaten wie den Aufnahmeort */
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = (await new Promise(r => c.toBlob(r, 'image/jpeg', .85))) || file;
    return { url: URL.createObjectURL(blob), blob };
  } catch (e) { return { url: URL.createObjectURL(file), blob: file }; }
}
const mb = n => `${Math.max(0.1, n / 1048576).toLocaleString('de-AT', { maximumFractionDigits: 1 })} MB`;
function doReturn(l, extraMsg = '', extraUndo) {
  const snap = { ...l };
  Object.assign(l, { status: 'zurück', returned: T0 });
  const q = queue(l.gameId);

  toast(`${titleOf(l)} ist zurück im Regal.${q.length ? ` ${uname(q[0].userId)} hat es vorgemerkt.` : ''}${extraMsg}`, { label: 'Rückgängig', run: () => { Object.assign(l, snap); if (extraUndo) extraUndo(); refresh(); } });
}
function giveTo(gid, uid) {
  const g = gameById(gid), wishes = S.gifts.filter(w => w.gameId === gid);

}

    } else if (F.mode === 'other') {
      if (!F.start) { F.err = 'Bitte wähl den Tag, ab dem es verliehen ist.'; rerenderSheet(); calFocus(); return; }
      if (!F.ret.length) { F.err = 'Bitte wähl mindestens einen Rückgabetag.'; rerenderSheet(); calFocus(); return; }

  if (!admin) {
    const own = new Set(S.loans.map(l => l.id));
    foreign.filter(r => !own.has(r.id)).forEach(r => {
      S.loans.push(toForeign(r));
      S.users.push({ id: 'p_' + r.id, name: r.who || 'jemand', ini: initials(r.who), av: 7, pseudo: true });
    });
  }
  S.stats = Object.fromEntries(stats.map(s => [s.id, s.n]));
  S.gifts = wishes.map(toWish);
  S.lists = { [meRec.id]: lists.map(toList) };
  S.photos = photos.map(toPhoto);
  S.access = access.map(toAccess);
  const st = settings[0] || {};
  S.settings = { id: st.id, newWeeks: st.newWeeks || 3, link: st.showcase || '', owner: st.owner || 'Jakob', title: st.title || 'Spieleschrank', bggToken: st.bggToken || '' };
  S.user = meRec.id;
  if (S.photos.length) await refreshFileToken();
  const ids = rs => new Set(rs.map(r => r.id));
  snapshot({ users: ids(users), items: ids(items), loans: ids(loans), wishes: ids(wishes), known: ids(known), lists: ids(lists), photos: ids(photos), access_requests: ids(access), settings: ids(settings) });
}
async function refreshFileToken() { try { S.fileToken = await pb.files.getToken(); } catch (e) { S.fileToken = ''; } }

async function reload() {
  if (!pb.authStore.isValid) return;
  try { await loadAll(); } catch (e) { if (e.status === 401 || e.status === 403) { await logout(true); return; } console.warn(e); return; }
  S.ready = true;
  if (S.view === 'app' && !me()?.mustChange) refresh(); else renderApp();
}

/* ---------- Anmelden, Abmelden, erster Login ---------- */
async function login(username, password) {
  await pb.collection('users').authWithPassword(username.trim().toLowerCase(), password);
  S.loginPw = password;   // nur für den Passwortwechsel beim ersten Login, bleibt im Speicher
  await startSession();
}
async function startSession() {
  S.ready = false;
  await loadAll();
  S.view = 'app'; S.tab = 'regal'; resetMode();
  S.ready = true;
  const u = me(), prev = u.lastVisit;
  renderApp(); scrollTo(0, 0);
  if (!u.mustChange && (!prev || !same(prev, T0))) { S.prevVisit = prev; u.lastVisit = T0; schedulePersist(); }
  subscribe();
}
async function logout(expired) {
  try { pb.realtime.unsubscribe(); } catch (e) { }
  pb.authStore.clear();
  Object.assign(S, { user: null, ready: false, games: [], loans: [], users: [], gifts: [], photos: [], lists: {}, access: [], loginPw: null });
  shadow = {};
  closeSheet(); S.view = 'app'; renderApp(); scrollTo(0, 0);
  toast(expired ? 'Bitte melde dich neu an.' : 'Abgemeldet');
}
async function changeOwnPassword(pw, old) {
  const u = me();
  await pb.collection('users').update(u.id, { oldPassword: old ?? S.loginPw ?? '', password: pw, passwordConfirm: pw, mustChange: false });
  await pb.collection('users').authWithPassword(u.username, pw);
  S.loginPw = null;
  u.mustChange = false; remember('users', u.id, userRec(u));
}

/* ---------- Was nicht in den Abgleich passt: Konten, Dateien, BGG ---------- */
async function apiCreateUser(u, password) {
  const r = await pb.collection('users').create({ id: u.id, username: u.username, name: u.name, ort: u.ort || '', phone: u.phone || '', color: u.av || 0, role: 'member', password, passwordConfirm: password });
  const nu = toUser(r); S.users.push(nu); remember('users', nu.id, userRec(nu));
  return nu;
}
async function apiSetPassword(uid, password) {
  await pb.collection('users').update(uid, { password, passwordConfirm: password, mustChange: true });
  const u = userById(uid); u.mustChange = true; remember('users', uid, userRec(u));
}
async function apiUploadPhotos(l, blobs, caption) {
  const fd = new FormData();
  fd.append('id', newId()); fd.append('user', S.user); fd.append('item', l.gameId); fd.append('loan', l.id); fd.append('caption', caption);
  blobs.forEach((b, i) => fd.append('files', b, `foto-${i + 1}.jpg`));
  const r = await pb.collection('photos').create(fd);
  const p = toPhoto(r); S.photos.unshift(p); remember('photos', p.id, photoRec(p));
}
async function apiItemFiles(id, files) {
  const fd = new FormData();
  Object.entries(files).forEach(([k, v]) => { if (v === null) fd.append(k, ''); else fd.append(k, v, v.name || k); });
  const r = await pb.collection('items').update(id, fd);
  const g = gameById(id); if (g) { g.img = coverURL(r); g.cover = r.cover || ''; g.rules = r.rules ? { lang: r.rulesLang || 'Deutsch', size: '', file: r.rules } : null; g._r = r; }
  coverCache.clear();
}
async function apiCoverFromBgg(id) {
  try { await pb.send(`/api/bgg/cover/${id}`, { method: 'POST' }); const r = await pb.collection('items').getOne(id); const g = gameById(id); if (g) { g.img = coverURL(r); g.cover = r.cover; g._r = r; } refresh(); } catch (e) { /* ohne Cover geht es auch */ }
}
async function openRules(id) {
  const g = gameById(id); if (!g?.rules?.file) return;
  const w = window.open('', '_blank');
  try {
    const token = await pb.files.getToken();
    const url = pb.files.getURL(g._r, g.rules.file, { token });
    if (w) w.location = url; else location.href = url;
  } catch (e) { if (w) w.close(); toast(serverMsg(e)); }
}
const blobFromDataURL = async url => (await fetch(url)).blob();

/* ---------- Live: neue Anfragen und Entscheidungen erscheinen ohne Neuladen ---------- */
let reloadTimer = null;
const softReload = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => { if (!persisting && !S.sheetView) reload(); else softReload(); }, 600); };
function subscribe() {
  try {
    pb.realtime.unsubscribe();
    ['loans', 'items', 'settings'].concat(isAdmin() ? ['wishes', 'access_requests', 'photos', 'users'] : []).forEach(c => pb.collection(c).subscribe('*', softReload).catch(() => { }));
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.ready) softReload(); });
setInterval(() => { if (document.visibilityState === 'visible' && S.ready) softReload(); }, 120000);
setInterval(() => { if (S.ready && S.photos.length) refreshFileToken(); }, 150000);

/* ---------- Schaufenster ohne Login ---------- */
async function loadShowcase(token) {
  const d = await pb.send(`/api/showcase/${encodeURIComponent(token)}`, { method: 'GET' });
  S.games = d.items.map(it => toItem({ ...it, lendable: true, archived: false, added: '' }));
  S.loans = []; S.users = []; S.gifts = []; S.photos = []; S.lists = {}; S.access = []; S.stats = {};
  S.settings = { newWeeks: 3, link: '', owner: d.owner, title: d.title };
}

/* ---------- Start ---------- */
async function boot() {
  const sc = location.pathname.match(/^\/schaufenster\/([A-Za-z0-9]+)/);
  if (sc) {
    try { await loadShowcase(sc[1]); S.view = 'showcase'; }
    catch (e) { S.view = 'gone'; }
    renderApp(); return;
  }
  if (pb.authStore.isValid) {
    try { await pb.collection('users').authRefresh(); await startSession(); return; }
    catch (e) { if (e.status !== 0) pb.authStore.clear(); else { S.offline = true; } }
  }
  S.view = 'app'; renderApp();
}
document.documentElement.lang = 'de-AT';
boot();
})();
</script>
