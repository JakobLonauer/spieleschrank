  --fg: #E5EDE8; --fg-2: #B2C0B8; --fg-3: #93A29A;

  --felt: #123A30; --on-felt: #F1F7F4; --on-felt-2: #A9CDBF;
  --sticker: #F6C447; --sticker-ink: #2A1E00;
  --lent-bg: #3A2A12; --lent-ink: #F2C77C; --res-bg: #1C2845; --res-ink: #AEC4F4;
  --lock-bg: #222D28; --lock-ink: #B2C0B8; --danger: #F29A8F; --danger-bg: #3A1714;
  --plank: #4A3D2E; --plank-top: #5B4C3A;
  --toast-bg: #E5EDE8; --toast-fg: #0E1512; --toast-act: #1F6B57;
  --scrim: rgba(0, 0, 0, .58); --shadow: 0 0 0; --brand-3: #E98473;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center; }
input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap {
  width: 100%; max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 760px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- Prototyp-Leiste ---------- */
.proto { background: var(--surface-2); border-bottom: 1px dashed var(--line); color: var(--fg-2); font-size: 13.5px; }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 8px; }
.proto-label b { color: var(--fg); font-weight: 700; }
.proto-seg { display: flex; flex-wrap: wrap; gap: 4px; }
.proto-seg button { height: 30px; padding: 0 11px; border-radius: 8px; color: var(--fg-2); font-weight: 600; font-size: 13px; transition: background .15s, color .15s; }
.proto-seg button:hover { background: var(--surface-3); color: var(--fg); }
.proto-seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(var(--shadow) / .14); }

/* ---------- Kopfzeile & Tabs ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in oklab, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in { display: flex; align-items: center; gap: 16px; height: 62px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 760; font-size: 21px; letter-spacing: -.025em; border-radius: 10px; padding: 4px 6px 4px 2px; margin-left: -2px; }
.brand svg { width: 28px; height: 28px; }
.dtabs { display: none; margin-left: auto; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; }
.dtab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--fg-2); transition: background .15s, color .15s; }
.dtab:hover { color: var(--fg); }
.dtab[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(var(--shadow) / .12), 0 3px 8px -4px rgb(var(--shadow) / .25); }
.dtab .i { width: 18px; height: 18px; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.avatar-btn { margin-left: auto; border-radius: 50%; transition: transform .15s var(--ease); }
.avatar-btn:active { transform: scale(.94); }
@media (min-width: 760px) {
  .dtabs { display: inline-flex; }
  .avatar-btn { margin-left: 8px; }
}
.av { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--avc, #CFE6D8); color: #1D2722; font-weight: 700; font-size: 15px; flex: none; }
.av.lg { width: 44px; height: 44px; font-size: 17px; }
.av.sm { width: 32px; height: 32px; font-size: 13.5px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: 1fr 1fr;
  padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in oklab, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  border-top: 1px solid var(--line);
}
.ttab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--fg-2); font-size: 12.5px; font-weight: 650; }
.ttab-ic { position: relative; display: grid; place-items: center; width: 60px; height: 32px; border-radius: 999px; transition: background .2s var(--ease), color .2s; }
.ttab[aria-current="page"] { color: var(--fg); }
.ttab[aria-current="page"] .ttab-ic { background: var(--accent-soft); color: var(--accent-ink); }
.ttab .badge { position: absolute; top: -4px; right: 6px; min-width: 18px; height: 18px; font-size: 11px; padding: 0 5px; box-shadow: 0 0 0 2px var(--surface); }
@media (min-width: 760px) { .tabbar { display: none; } }

/* ---------- Ansicht ---------- */
.view { padding-top: 12px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .view { padding-top: 20px; padding-bottom: 72px; } }
.narrow { max-width: 780px; margin-inline: auto; }
.view.fade-in { animation: viewIn .24s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }

.h1 { font-family: var(--font-display); font-weight: 750; font-size: 27px; line-height: 1.12; letter-spacing: -.028em; text-wrap: balance; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.2; letter-spacing: -.018em; text-wrap: balance; }
.sub { color: var(--fg-2); font-size: 15.5px; }
@media (min-width: 760px) { .h1 { font-size: 32px; } .h2 { font-size: 23px; } }
.count { color: var(--fg-3); font-weight: 600; font-family: var(--font-body); font-size: .78em; letter-spacing: 0; margin-left: 4px; font-variant-numeric: tabular-nums; }
.link { color: var(--accent-ink); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--accent) 40%, transparent); border-radius: 4px; transition: text-decoration-color .15s; }
.link:hover { text-decoration-color: currentColor; }
:root .link { color: var(--accent); }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; }
.page-head > div { display: grid; gap: 4px; min-width: 0; }

/* ---------- Suche & Filter ---------- */
.tools { display: grid; gap: 12px; margin: 16px 0 26px; }
@media (min-width: 760px) { .tools { grid-template-columns: minmax(260px, 380px) 1fr; align-items: center; gap: 12px 16px; } }
.search { position: relative; display: flex; align-items: center; }
.search > .i { position: absolute; left: 14px; color: var(--fg-3); pointer-events: none; }
.search input {
  width: 100%; height: 50px; padding: 0 46px 0 44px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); font-size: 16px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--fg-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search input::-webkit-search-cancel-button { display: none; }
.search-clear { position: absolute; right: 6px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--fg-2); }
.search-clear:hover { background: var(--surface-2); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-weight: 620; font-size: 15px; color: var(--fg); white-space: nowrap;
  transition: background .18s, border-color .18s, color .18s, transform .12s var(--ease);
}
.chip .i { width: 18px; height: 18px; color: var(--fg-2); transition: color .18s; }
.chip .chev { width: 16px; height: 16px; margin-right: -4px; transition: transform .2s var(--ease); }
.chip[aria-expanded="true"] .chev { transform: rotate(180deg); }
.chip:hover { border-color: color-mix(in oklab, var(--fg) 28%, var(--line)); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.chip.on .i { color: var(--accent-ink); }
.chip .tick { width: 0; margin-right: -7px; opacity: 0; transition: width .2s var(--ease), margin .2s var(--ease), opacity .15s; }
.chip.on .tick { width: 18px; margin-right: 0; opacity: 1; }

.pop {
  position: absolute; z-index: 40; min-width: 240px; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  box-shadow: 0 2px 4px rgb(var(--shadow) / .08), 0 20px 40px -14px rgb(var(--shadow) / .35);
  transform-origin: top left;
}
.pop.in { animation: popIn .18s var(--ease); }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
.pop-title { font-weight: 700; font-size: 15px; margin: 2px 4px 12px; }
.numgrid { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; }
.num, .pop-any, .pop-opt {
  height: 50px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: 17px;
  font-variant-numeric: tabular-nums; transition: background .15s, color .15s, transform .12s var(--ease);
}
.num:hover, .pop-any:hover, .pop-opt:hover { background: var(--surface-3); }
.num:active, .pop-any:active, .pop-opt:active { transform: scale(.96); }
.num[aria-pressed="true"], .pop-any[aria-pressed="true"], .pop-opt[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pop-any[aria-pressed="true"], .pop-opt.any[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.pop-any { width: 100%; margin-top: 8px; font-size: 15px; font-weight: 650; height: 44px; }
.pop-list { display: grid; gap: 6px; min-width: 232px; }
.pop-opt { height: 46px; padding: 0 14px; text-align: left; font-size: 15.5px; font-weight: 620; display: flex; align-items: center; justify-content: space-between; }
.pop-opt .i { opacity: 0; }
.pop-opt[aria-pressed="true"] .i { opacity: 1; }
.acct { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.acct-name { font-weight: 700; }
.acct-role { color: var(--fg-2); font-size: 14px; }
.pop-item { text-align: left; display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 10px; border-radius: 10px; font-weight: 600; color: var(--fg); }
.pop-item:hover { background: var(--surface-2); }

/* ---------- Abschnitte, Kacheln, Regal ---------- */
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.section + .section { margin-top: 36px; }
.sec-head { display: grid; gap: 3px; }
.sec-head.inline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 14px; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 30px 22px; } }

.tile { display: flex; flex-direction: column; gap: 11px; min-width: 0; border-radius: 10px; text-align: left; }
.tile:focus-visible { outline-offset: 5px; }
.cover {
  position: relative; display: block; aspect-ratio: 1; max-width: 100%; border-radius: 7px; overflow: hidden; isolation: isolate;
  background: var(--tint, var(--surface-3));
  box-shadow: 0 3px 0 color-mix(in oklab, var(--tint, #888) 60%, #000), 0 12px 20px -12px rgb(var(--shadow) / .6);
  transition: transform .26s var(--ease), box-shadow .26s var(--ease);
}
.cover > svg { display: block; width: 100%; height: 100%; }
.cover::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), inset 0 1px 0 rgba(255, 255, 255, .28); background: linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 42%); }
.cover::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background-image: var(--grain); opacity: .22; mix-blend-mode: multiply; }
@media (hover: hover) {
  .tile:hover .cover { transform: translateY(-4px); box-shadow: 0 3px 0 color-mix(in oklab, var(--tint, #888) 60%, #000), 0 20px 26px -14px rgb(var(--shadow) / .6); }
}
.tile:active .cover { transform: translateY(0) scale(.975); transition-duration: .1s; }

.tile-title { font-weight: 680; font-size: 15.5px; line-height: 1.28; letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 11px; color: var(--fg-2); font-size: 13.5px; font-weight: 550; margin-top: -5px; font-variant-numeric: tabular-nums; }
.meta .m { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.meta .i { width: 15px; height: 15px; color: var(--fg-3); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line); }
.pips i.on { background: var(--fg-2); box-shadow: none; }

.pill {
  position: absolute; z-index: 2; left: 8px; top: 8px;
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .005em; white-space: nowrap;
  background: var(--pb); color: var(--pi); box-shadow: 0 1px 2px rgba(0, 0, 0, .18), 0 0 0 1px rgba(255, 255, 255, .12);
}
.pill .i { width: 14px; height: 14px; stroke-width: 2.2; }
.t-lent { --pb: var(--lent-bg); --pi: var(--lent-ink); }
.t-res { --pb: var(--res-bg); --pi: var(--res-ink); }
.t-lock { --pb: var(--lock-bg); --pi: var(--lock-ink); }
.t-mine { --pb: var(--accent-soft); --pi: var(--accent-ink); }
.t-danger { --pb: var(--danger-bg); --pi: var(--danger); }
.t-ok { --pb: var(--surface-2); --pi: var(--fg-2); }

.sticker {
  position: absolute; z-index: 2; right: 7px; top: 7px; width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center; text-align: center; transform: rotate(-12deg);
  background: var(--sticker); color: var(--sticker-ink);
  font-family: var(--font-display); font-weight: 800; font-size: 12.5px; line-height: 1.02; letter-spacing: -.01em;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .28), inset 0 0 0 2px rgba(255, 255, 255, .4), inset 0 -3px 0 rgba(0, 0, 0, .08);
}

/* Leih-mich-Regal mit Brett */
.feature { --cov: 150px; --row-pt: 6px; }
@media (min-width: 760px) { .feature { --cov: 176px; } }
.shelf { position: relative; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
@media (min-width: 760px) { .shelf { margin-inline: 0; } }
.shelf::before {
  content: ""; position: absolute; z-index: 0; left: 0; right: 0;
  top: calc(var(--row-pt) + var(--cov) + 3px); height: 12px; border-radius: 3px;
  background: linear-gradient(var(--plank-top), var(--plank) 70%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .25) inset, 0 10px 14px -8px rgb(var(--shadow) / .45);
}
.shelf-row {
  position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: var(--cov); gap: 18px;
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: var(--row-pt) max(16px, env(safe-area-inset-left, 0px)) 4px;
  scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.shelf-row::-webkit-scrollbar { display: none; }
@media (min-width: 760px) { .shelf-row { padding-inline: 0; scrollbar-width: thin; gap: 24px; } }
.shelf-row .tile { scroll-snap-align: start; gap: 26px; }
.shelf-row .tile .cover { box-shadow: 0 3px 0 color-mix(in oklab, var(--tint, #888) 60%, #000), 0 2px 3px rgb(var(--shadow) / .25); }

/* Leerer Zustand */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 16px 24px; max-width: 460px; margin: 0 auto; }
.empty .h2 { margin-top: 10px; }
.empty .btn { margin-top: 10px; }
.mini-pile { position: relative; width: 150px; height: 104px; }
.mini-pile .cover { position: absolute; width: 72px; }

/* ---------- Buttons & Formulare ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 22px; border-radius: 14px; font-weight: 680; font-size: 16px; white-space: nowrap;
  transition: background .16s, color .16s, box-shadow .16s, transform .12s var(--ease), opacity .16s;
  text-decoration: none;
}
.btn:active { transform: scale(.975); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 8px 18px -10px rgb(var(--shadow) / .7); }
.btn-primary:hover:not([disabled]) { background: var(--accent-press); }
.btn-quiet { background: var(--surface-2); color: var(--fg); }
.btn-quiet:hover:not([disabled]) { background: var(--surface-3); }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
.btn-danger:hover { filter: brightness(.97); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn-sm { height: 42px; padding: 0 16px; border-radius: 12px; font-size: 15px; }
.btn-block { width: 100%; }
.btn .i { width: 19px; height: 19px; }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--fg-2); transition: background .15s, color .15s, transform .12s var(--ease); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn:active { transform: scale(.94); }

.field { display: grid; gap: 8px; }
.label { font-weight: 680; font-size: 15px; }
.help { color: var(--fg-2); font-size: 14px; }
.input, .textarea {
  width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.input { height: 50px; padding: 0 14px; }
.textarea { min-height: 96px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
.input:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 14px; font-weight: 600; }
.opt { color: var(--fg-3); font-weight: 500; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg button { height: 44px; padding: 0 6px; border-radius: 10px; font-weight: 640; font-size: 15px; color: var(--fg-2); transition: background .18s, color .18s, box-shadow .18s; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(var(--shadow) / .14), 0 3px 8px -3px rgb(var(--shadow) / .22); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tagbtn { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 620; font-size: 14.5px; transition: background .15s, border-color .15s, color .15s; display: inline-flex; align-items: center; gap: 6px; }
.tagbtn .i { width: 16px; height: 16px; display: none; }
.tagbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.tagbtn[aria-pressed="true"] .i { display: block; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 0; }

.switch { position: relative; flex: none; width: 52px; height: 32px; border-radius: 999px; background: var(--surface-3); transition: background .2s var(--ease); }

.check { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; user-select: none; }

.check .box { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--fg-3); transition: background .15s, border-color .15s; }
.check .box .i { width: 16px; height: 16px; stroke-width: 2.6; color: var(--on-accent); opacity: 0; transition: opacity .15s; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box .i { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Bottom Sheet / Seitenpanel ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 50; }
@media (min-width: 760px) { .sheet-root { right: auto; width: 100vw; } }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .32s var(--ease); }

.sheet {

.grab span { width: 40px; height: 5px; border-radius: 999px; background: color-mix(in oklab, var(--fg) 22%, transparent); }
.sheet-close { position: absolute; z-index: 4; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.sheet-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; }
.sheet-foot {
  flex: none; display: flex; gap: 10px; border-top: 1px solid var(--line); background: var(--surface);
  padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.sheet-foot > .btn { flex: 1 1 0; }
.sheet-foot > .btn-quiet:first-child:not(:only-child) { flex: 0 1 auto; }
@media (min-width: 760px) {
  .sheet { left: auto; top: 0; width: min(468px, 100%); max-height: none; border-radius: 24px 0 0 24px; transform: translateX(104%); box-shadow: -16px 0 50px -20px rgb(var(--shadow) / .45); }
  .grab { display: none; }
}
.sheet-scroll.step-in > * { animation: stepIn .26s var(--ease) both; }
.sheet-foot.step-in { animation: stepIn .26s var(--ease) both; }
@keyframes stepIn { from { opacity: 0; transform: translateY(8px); } }
.pad { padding: 26px max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px)); }
.stack { display: grid; gap: 20px; }
.stack-s { display: grid; gap: 10px; }
.sheet-title { font-family: var(--font-display); font-weight: 750; font-size: 25px; line-height: 1.14; letter-spacing: -.025em; text-wrap: balance; outline: none; padding-right: 48px; }

.gs-head {

  padding: 34px max(64px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, color-mix(in oklab, var(--tint) 30%, var(--surface)) 0%, color-mix(in oklab, var(--tint) 10%, var(--surface)) 70%, var(--surface) 100%);
}

.tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: color-mix(in oklab, var(--surface) 70%, transparent); border: 1px solid color-mix(in oklab, var(--fg) 12%, transparent); font-size: 13px; font-weight: 620; color: var(--fg-2); }

.status { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; padding: 14px 16px; border-radius: 16px; background: var(--pb); color: var(--pi); font-weight: 620; line-height: 1.4; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.togglebtn { justify-self: start; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; transition: background .18s, color .18s, border-color .18s, transform .12s var(--ease); }

.compact-head { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }

@keyframes markPop { from { transform: scale(.55); opacity: 0; } }
@keyframes markDraw { to { stroke-dashoffset: 0; } }

.cred { width: 100%; display: grid; gap: 2px; padding: 6px 0; border-radius: 16px; background: var(--surface-2); text-align: left; }

/* ---------- Listen (Meine, Verwalten) ---------- */

function pillFor(g) {
  const admin = isAdmin(), cur = current(g.id);
  if (!admin) {
    const mine = mineFor(g.id);
    if (mine) {
      if (mine.status === 'verliehen') return overdue(mine) ? { t: 'Rückgabe fällig', tone: 'danger' } : { t: 'Bei dir', tone: 'mine' };
      if (mine.status === 'reserviert') return { t: 'Abholbereit', tone: 'mine' };
      return { t: cur ? 'Vorgemerkt' : 'Angefragt', tone: 'mine' };
    }
    if (declinedFor(g.id)) return { t: 'Abgelehnt', tone: 'lock' };
  }
  if (cur) {
    if (cur.status === 'reserviert') return { t: 'Reserviert', tone: 'res' };
    if (admin && overdue(cur)) return { t: 'Überfällig', tone: 'danger' };
    return { t: 'Verliehen', tone: 'lent' };
  }
  if (!g.lendable) return { t: 'Nur gemeinsam', tone: 'lock', icon: 'lock' };
  if (admin) { const n = pending(g.id).length; if (n) return { t: n === 1 ? '1 Anfrage' : `${n} Anfragen`, tone: 'mine' }; }
  if (isNew(g)) return { t: 'Neu', tone: 'new' };
  return null;
}

function statusFor(g) {
  const admin = isAdmin(), cur = current(g.id), pend = pending(g.id);
  if (admin) {
    if (cur && cur.status === 'verliehen') {
      const who = uname(cur.userId);
      const vis = cur.pub ? 'Alle sehen, bei wem es ist.' : `Nur du und ${who} sehen, bei wem es ist.`;
      const wait = pend.length ? ` Vorgemerkt: ${pend.map(l => uname(l.userId)).join(', ')}.` : '';
      if (overdue(cur)) return { tone: 'danger', icon: 'glass', text: `Bei ${who}. Die Rückgabe war für ${fd(cur.due)} geplant.`, sub: vis + wait };
      return { tone: 'lent', icon: 'box', text: cur.due ? `Bei ${who} bis ${fd(cur.due)}.` : `Bei ${who}, ohne festes Rückgabedatum.`, sub: vis + wait };
    }
    if (cur) return { tone: 'res', icon: 'cal', text: `Für ${uname(cur.userId)} reserviert, noch nicht übergeben.`, sub: `Leihdauer: ${durLabel(cur)}.` };
    if (!g.lendable) return { tone: 'lock', icon: 'lock', text: 'Nicht verleihbar.', sub: 'Alle anderen sehen „Nur gemeinsam“. Direkt verleihen kannst du es trotzdem.' };
    if (pend.length) return { tone: 'mine', icon: 'inbox', text: `Angefragt von ${pend.map(l => uname(l.userId)).join(', ')}.`, sub: 'Annehmen kannst du unter Verwalten oder hier direkt mit „Verleihen“.' };
    return { tone: 'ok', icon: 'check', text: 'Steht im Regal und ist frei.' };
  }
  const mine = mineFor(g.id);
  if (mine) {
    if (mine.status === 'verliehen') {
      if (overdue(mine)) return { tone: 'danger', icon: 'glass', text: `Bei dir. Die Rückgabe war für ${fd(mine.due)} geplant.`, sub: 'Bring es Jakob einfach beim nächsten Treffen mit.' };
      return { tone: 'mine', icon: 'box', text: mine.due ? `Bei dir bis ${fd(mine.due)}.` : 'Bei dir, ohne festes Rückgabedatum.', sub: 'Die Rückgabe trägt Jakob ein, sobald er es wieder hat.' };
    }
    if (mine.status === 'reserviert') return { tone: 'mine', icon: 'cal', text: 'Für dich reserviert.', sub: 'Mach mit Jakob aus, wann du es abholst.' };
    if (cur) return { tone: 'mine', icon: 'check', text: `Vorgemerkt. Du bist Nummer ${queuePos(mine)} in der Reihe.`, sub: 'Sobald es zurück ist, meldet sich Jakob.' };
    return { tone: 'mine', icon: 'check', text: `Angefragt ${ago(mine.created)}.`, sub: 'Jakob meldet sich bei dir.' };
  }
  const dec = declinedFor(g.id);
  if (dec) return { tone: 'lock', icon: 'x', text: 'Jakob hat deine Anfrage abgelehnt.', sub: dec.reason ? `„${dec.reason}“` : 'Du kannst es später gern nochmal versuchen.' };
  if (cur) {
    const who = uname(cur.userId), after = g.lendable ? 'Du kannst es vormerken.' : 'Danach spielt Jakob es lieber gemeinsam mit dir.';
    if (cur.status === 'reserviert') return { tone: 'res', icon: 'cal', text: cur.pub ? `Gerade für ${who} reserviert.` : 'Gerade reserviert.', sub: g.lendable ? 'Du kannst es trotzdem vormerken.' : after };
    if (cur.pub) return { tone: 'lent', icon: 'box', text: cur.due ? `Gerade bei ${who}, bis ${fd(cur.due)}.` : `Gerade bei ${who}, ohne festes Rückgabedatum.`, sub: after };
    return { tone: 'lent', icon: 'box', text: 'Gerade verliehen.', sub: after };
  }
  if (!g.lendable) return { tone: 'lock', icon: 'lock', text: 'Spielt Jakob lieber gemeinsam mit dir.', sub: g.once === 'verbraucht' ? 'Beim Spielen wird Material verbraucht.' : 'Frag ihn einfach beim nächsten Treffen.' };
  return { tone: 'ok', icon: 'check', text: 'Steht im Regal und ist frei.' };
}

function matches(g, f = S.f, q = S.q) {
  if (q.trim() && !norm(g.title).includes(norm(q.trim()))) return false;
  if (f.players) { if (f.players >= 8) { if (g.players[1] < 8) return false; } else if (f.players < g.players[0] || f.players > g.players[1]) return false; }

  if (f.avail && !isAvailable(g)) return false;
  if (f.genres.length && !f.genres.some(x => g.genres.includes(x))) return false;

  if (f.age && g.age > f.age) return false;
  return true;
}

/* ---------- Sheet ---------- */
const sheetRoot = $('#sheet'), sheetPanel = $('#sheet-panel'), sheetBody = $('#sheet-body'), sheetFoot = $('#sheet-foot');
let lastFocus = null, lastKey = null, closeTimer = null;
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (el.matches('#view .h1')) return '#view .h1';
  if (el.dataset && el.dataset.act) return `[data-act="${el.dataset.act}"]` + (el.dataset.id ? `[data-id="${el.dataset.id}"]` : '');
  return null;
}
function restoreFocus(el, key) {
  if (!el || el === document.body) return;
  if (document.contains(el) && el.offsetParent !== null) { el.focus({ preventScroll: true }); return; }
  const k = key && document.querySelector(key);
  (k && k.offsetParent !== null ? k : $('#view .h1'))?.focus({ preventScroll: true });
}
function openSheet(view, { focus = 'title' } = {}) {
  closePop(false);
  const wasOpen = !sheetRoot.hidden && sheetRoot.classList.contains('open');
  S.sheetView = view;
  paintSheet(wasOpen);
  if (!wasOpen) {
    clearTimeout(closeTimer);
    lastFocus = document.activeElement; lastKey = focusKey(lastFocus);
    sheetRoot.hidden = false;
    document.documentElement.classList.add('lock', 'sheet-open');
    sheetBody.scrollTop = 0;
    void sheetPanel.offsetWidth;
    sheetRoot.classList.add('open');
  } else sheetBody.scrollTop = 0;
  requestAnimationFrame(() => {
    const target = focus === 'title' ? $('#sheet-title') : $(focus);
    target?.focus({ preventScroll: true });
  });
}
function paintSheet(step) {
  const v = S.sheetView(); if (!v) return;
  sheetBody.innerHTML = v.body;
  sheetFoot.innerHTML = v.foot || '';
  sheetFoot.hidden = !v.foot;
  if (step && !reduce()) {
    [sheetBody, sheetFoot].forEach(el => { el.classList.remove('step-in'); void el.offsetWidth; el.classList.add('step-in'); });
  }
}
function rerenderSheet() {
  if (!S.sheetView) return;
  const fid = document.activeElement && sheetPanel.contains(document.activeElement) ? document.activeElement.id : null;
  const st = sheetBody.scrollTop;
  sheetBody.classList.remove('step-in'); sheetFoot.classList.remove('step-in');
  paintSheet(false);
  sheetBody.scrollTop = st;
  if (fid) document.getElementById(fid)?.focus({ preventScroll: true });
}
function closeSheet() {
  if (sheetRoot.hidden) return;
  sheetRoot.classList.remove('open');
  S.sheetView = null; S.form = {}; S.undo = null;
  document.documentElement.classList.remove('sheet-open');
  const done = () => {
    if (sheetRoot.classList.contains('open')) return;
    sheetRoot.hidden = true; sheetBody.innerHTML = ''; sheetFoot.innerHTML = '';
    document.documentElement.classList.remove('lock');
  };
  clearTimeout(closeTimer);
  closeTimer = setTimeout(done, reduce() ? 0 : 460);
  restoreFocus(lastFocus, lastKey);
}
const sheetOpen = () => !sheetRoot.hidden && sheetRoot.classList.contains('open');

/* Wischen zum Schließen (nur Handy) */
(() => {
  let drag = null;
  const grab = $('#sheet-grab'), scrim = sheetRoot.querySelector('.scrim');
  grab.addEventListener('pointerdown', e => {
    if (!isMobile()) return;
    drag = { y0: e.clientY, t0: performance.now(), dy: 0 };
    grab.setPointerCapture(e.pointerId);
    sheetPanel.classList.add('dragging');
  });
  grab.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.dy = Math.max(0, e.clientY - drag.y0);
    sheetPanel.style.transform = `translateY(${drag.dy}px)`;
    scrim.style.opacity = String(1 - Math.min(drag.dy / 420, .7));
  });
  const end = () => {
    if (!drag) return;
    const v = drag.dy / Math.max(1, performance.now() - drag.t0);
    sheetPanel.classList.remove('dragging');
    sheetPanel.style.transform = ''; scrim.style.opacity = '';
    if (drag.dy > 110 || (v > .55 && drag.dy > 24)) closeSheet();
    drag = null;
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
})();

/* ---------- Popover ---------- */
const pop = $('#pop');
function openPop(html, anchor, label, align = 'start') {
  if (S.popAnchor === anchor && !pop.hidden) { closePop(true); return; }
  closePop(false);
  pop.innerHTML = html; pop.hidden = false; pop.setAttribute('aria-label', label);
  S.popAnchor = anchor; anchor.setAttribute('aria-expanded', 'true');
  const r = anchor.getBoundingClientRect(), vw = document.documentElement.clientWidth, pw = pop.offsetWidth;
  let left = align === 'end' ? r.right - pw : r.left;
  left = Math.max(12, Math.min(left, vw - pw - 12));
  pop.style.left = `${left + scrollX}px`; pop.style.top = `${r.bottom + scrollY + 8}px`;
  pop.style.transformOrigin = align === 'end' ? 'top right' : 'top left';
  pop.classList.remove('in'); void pop.offsetWidth; pop.classList.add('in');
  (pop.querySelector('[aria-pressed="true"]') || pop.querySelector('button'))?.focus({ preventScroll: true });
}
function closePop(returnFocus) {
  if (pop.hidden) return;
  pop.hidden = true;
  const a = S.popAnchor; S.popAnchor = null;
  if (a && document.contains(a)) { a.setAttribute('aria-expanded', 'false'); if (returnFocus) a.focus({ preventScroll: true }); }
}

/* ---------- Toast mit Rückgängig ---------- */
let toastTimer = null;
function toast(msg, action) {
  const box = $('#toasts');
  box.innerHTML = `<div class="toast" role="status"><span>${esc(tidy(msg))}</span>${action ? `<button class="toast-act" id="toast-act">${esc(action.label)}</button>` : ''}</div>`;
  const el = box.querySelector('.toast');
  if (action) $('#toast-act').addEventListener('click', () => { action.run(); hideToast(); });
  const arm = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); };
  /* Hinweis bleibt stehen, solange man darauf zeigt oder ihn per Tastatur ansteuert */
  el.addEventListener('mouseenter', () => clearTimeout(toastTimer));
  el.addEventListener('mouseleave', () => arm(2500));
  el.addEventListener('focusin', () => clearTimeout(toastTimer));
  el.addEventListener('focusout', () => arm(2500));
  arm(action ? 6000 : 3200);
}
function hideToast() { const t = $('#toasts .toast'); if (!t) return; t.classList.add('out'); setTimeout(() => t.remove(), 200); }
function withUndo(l, msg) {
  const snap = { ...l };
  toast(msg, { label: 'Rückgängig', run: () => { Object.assign(l, snap); refresh(); } });
}

  'pw-toggle': t => { const i = $('#' + (t.dataset.for || 'lg-pw')); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; t.setAttribute('aria-pressed', String(show)); t.setAttribute('aria-label', show ? 'Passwort verbergen' : 'Passwort anzeigen'); t.innerHTML = ic(show ? 'eyeoff' : 'eye'); },
  'access-request': () => { S.form = { name: '', contact: '' }; openSheet(accessRequestView()); },
  'ar-send': () => {
    const F = S.form; F.name = ($('#ar-name')?.value || '').trim(); F.contact = ($('#ar-contact')?.value || '').trim();
    F.err = !F.name ? 'name' : !F.contact ? 'contact' : null;
    F.errText = F.err === 'name' ? 'Bitte gib deinen Namen ein.' : F.err === 'contact' ? 'Bitte gib an, wie Jakob dich erreicht.' : null;
    if (F.err) { rerenderSheet(); $(F.err === 'name' ? '#ar-name' : '#ar-contact')?.focus(); return; }
    S.access.push({ id: 'a' + Date.now(), name: F.name, contact: F.contact, created: day(0) });
    S.form = {};
    openSheet(simpleDone('Anfrage gesendet', 'Jakob meldet sich bei dir mit deinen Zugangsdaten.'));
  }
};
function afterMore() { rerenderSheet(); renderChips(); renderResults(false); }

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('pointerdown', e => {
  if (pop.hidden) return;
  if (pop.contains(e.target) || (S.popAnchor && S.popAnchor.contains(e.target))) return;
  closePop(false);
});
let qTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    S.q = t.value; $('#q-clear').hidden = !t.value;
    clearTimeout(qTimer); qTimer = setTimeout(() => renderResults(false), 110);
  } else if (t.id === 'bgg-q') bggSearch(t.value);
  else if (t.id === 'f-msg') S.form.msg = t.value;
  else if (t.id === 'f-date') { S.form.date = t.value; if (S.form.err) { S.form.err = null; rerenderSheet(); } }
  else if (t.id === 'acc-date') { S.form.date = t.value; S.form.err = null; rerenderSheet(); }
  else if (t.id === 'gf-desc') S.form.desc = t.value;
  else if (t.id === 'pf-name') { S.form.name = t.value; if (!S.form.userTouched) { S.form.user = slug(t.value.replace(/^(Oma|Opa|Onkel|Tante) /i, '')); const u = $('#pf-user'); if (u) u.value = S.form.user; } }
  else if (t.id === 'pf-user') { S.form.user = t.value; S.form.userTouched = true; }
  else if (t.id === 'pf-phone') S.form.phone = t.value;
  else if (t.id === 'ar-name') S.form.name = t.value;
  else if (t.id === 'ar-contact') S.form.contact = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'lend-u') { S.form.uid = t.value; S.form.err2 = null; rerenderSheet(); document.querySelector(`input[name="lend-u"][value="${t.value}"]`)?.focus({ preventScroll: true }); return; }
  if (t.name === 'gf-once') { S.form.once = t.value === 'none' ? null : t.value; if (!S.form.once) S.form.done = false; rerenderSheet(); document.querySelector(`input[name="gf-once"][value="${t.value}"]`)?.focus({ preventScroll: true }); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'pw-form') {
    e.preventDefault();
    const p1 = $('#np1').value, p2 = $('#np2').value, err = $('#np-err');
    const msg = p1.length < 8 ? 'Bitte wähl ein Passwort mit mindestens 8 Zeichen.' : p1 !== p2 ? 'Die beiden Passwörter stimmen nicht überein.' : '';
    if (msg) { err.textContent = msg; err.hidden = false; (p1.length < 8 ? $('#np1') : $('#np2')).focus(); return; }
    me().mustChange = false; renderApp(); scrollTo(0, 0); toast('Passwort gespeichert. Viel Spaß beim Stöbern!');
    return;
  }
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const name = $('#lg-user').value.trim().toLowerCase(), err = $('#lg-err');
  if (!name) { err.textContent = 'Bitte gib deinen Benutzernamen ein.'; err.hidden = false; $('#lg-user').focus(); return; }
  const u = S.users.find(x => x.username === name);
  if (!u) { err.textContent = 'Benutzername oder Passwort stimmt nicht.'; err.hidden = false; $('#lg-user').focus(); return; }
  S.user = u.id; S.tab = 'regal'; renderApp(); scrollTo(0, 0);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!pop.hidden) { closePop(true); e.preventDefault(); }
    else if (sheetOpen()) { closeSheet(); e.preventDefault(); }
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'bgg-q') { e.preventDefault(); return; }
  if (e.key === 'Tab' && !pop.hidden && pop.contains(document.activeElement)) {
    const f = [...pop.querySelectorAll('button')], first = f[0], last = f[f.length - 1], a = S.popAnchor;
    if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); closePop(false);
      const all = [...document.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),textarea')].filter(el => el.offsetParent !== null && !pop.contains(el));
      (all[all.indexOf(a) + 1] || a)?.focus();
    } else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); closePop(true); }
    return;
  }
  if (e.key === 'Tab' && sheetOpen()) {
    const f = [...sheetPanel.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !sheetPanel.contains(document.activeElement))) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});
addEventListener('scroll', () => {
  const tb = $('#topbar'); if (tb) tb.classList.toggle('scrolled', scrollY > 4);
  if (!pop.hidden && S.popAnchor && S.popAnchor.closest('.topbar')) closePop(false);
}, { passive: true });
let lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth !== lastW) { lastW = innerWidth; closePop(false); } });

/* Popup schließt, wenn der Fokus per Tastatur woanders hin wandert (Klicks regelt pointerdown) */
pop.addEventListener('focusout', e => { const to = e.relatedTarget; if (to && !pop.contains(to) && to !== S.popAnchor) closePop(false); });
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'chips') closePop(false); }, true);
document.addEventListener('focusin', e => { if (!pop.hidden && !pop.contains(e.target) && e.target !== S.popAnchor) closePop(false); });
document.documentElement.lang = 'de-AT';
renderApp();
})();
</script>

</body>
