  --felt: #123A30; --on-felt: #F1F7F4; --on-felt-2: #A9CDBF;
  --sticker: #F6C447; --sticker-ink: #2A1E00;
  --lent-bg: #3A2A12; --lent-ink: #F2C77C; --res-bg: #1C2845; --res-ink: #AEC4F4;
  --lock-bg: #222D28; --lock-ink: #B2C0B8; --danger: #F29A8F; --danger-bg: #3A1714;
  --plank: #4A3D2E; --plank-top: #5B4C3A;
  --toast-bg: #E5EDE8; --toast-fg: #0E1512; --toast-act: #1F6B57;
  --scrim: rgba(0, 0, 0, .58); --shadow: 0 0 0; --brand-3: #E98473;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center; }
input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap {
  width: 100%; max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 760px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- Prototyp-Leiste ---------- */
.proto { background: var(--surface-2); border-bottom: 1px dashed var(--line); color: var(--fg-2); font-size: 0.8438rem; }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 8px; }
.proto-label b { color: var(--fg); font-weight: 700; }
.proto-seg { display: flex; flex-wrap: wrap; gap: 4px; }
.proto-seg button { height: 30px; padding: 0 11px; border-radius: 8px; color: var(--fg-2); font-weight: 600; font-size: 0.8125rem; transition: background .15s, color .15s; }
@media (hover: hover) { .proto-seg button:hover { background: var(--surface-3); color: var(--fg); } }
.proto-seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(var(--shadow) / .14); }

/* ---------- Kopfzeile & Tabs ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in oklab, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in { display: flex; align-items: center; gap: 16px; height: 62px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 760; font-size: 1.3125rem; letter-spacing: -.025em; border-radius: 10px; padding: 4px 6px 4px 2px; margin-left: -2px; }
.brand svg { width: 28px; height: 28px; }
.dtabs { display: none; margin-left: auto; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; }
.dtab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 0.9375rem; color: var(--fg-2); transition: background .15s, color .15s; }
@media (hover: hover) { .dtab:hover { color: var(--fg); } }
.dtab[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(var(--shadow) / .12), 0 3px 8px -4px rgb(var(--shadow) / .25); }
.dtab .i { width: 18px; height: 18px; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.avatar-btn { margin-left: auto; border-radius: 50%; transition: transform .15s var(--ease); }
.avatar-btn:active { transform: scale(.94); }
@media (min-width: 760px) {
  .dtabs { display: inline-flex; }
  .avatar-btn { margin-left: 8px; }
}
.av { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--avc, #CFE6D8); color: #1D2722; font-weight: 700; font-size: 0.9375rem; flex: none; }
.av.lg { width: 44px; height: 44px; font-size: 1.0625rem; }
.av.sm { width: 32px; height: 32px; font-size: 0.8438rem; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: 1fr 1fr;
  padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in oklab, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  border-top: 1px solid var(--line);
}
.ttab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--fg-2); font-size: 0.7812rem; font-weight: 650; }
.ttab-ic { position: relative; display: grid; place-items: center; width: 60px; height: 32px; border-radius: 999px; transition: background .2s var(--ease), color .2s; }
.ttab[aria-current="page"] { color: var(--fg); }
.ttab[aria-current="page"] .ttab-ic { background: var(--accent-soft); color: var(--accent-ink); }
.ttab .badge { position: absolute; top: -4px; right: 6px; min-width: 18px; height: 18px; font-size: 0.6875rem; padding: 0 5px; box-shadow: 0 0 0 2px var(--surface); }
@media (min-width: 760px) { .tabbar { display: none; } }

/* ---------- Ansicht ---------- */
.view { padding-top: 12px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .view { padding-top: 20px; padding-bottom: 72px; } }
.narrow { max-width: 780px; margin-inline: auto; }
.view.fade-in { animation: viewIn .24s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }

.h1 { font-family: var(--font-display); font-weight: 750; font-size: 1.6875rem; line-height: 1.12; letter-spacing: -.028em; text-wrap: balance; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.3125rem; line-height: 1.2; letter-spacing: -.018em; text-wrap: balance; }
.sub { color: var(--fg-2); font-size: 0.9688rem; }
@media (min-width: 760px) { .h1 { font-size: 2rem; } .h2 { font-size: 1.4375rem; } }
.count { color: var(--fg-3); font-weight: 600; font-family: var(--font-body); font-size: .78em; letter-spacing: 0; margin-left: 4px; font-variant-numeric: tabular-nums; }
.link { color: var(--accent-ink); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--accent) 40%, transparent); border-radius: 4px; transition: text-decoration-color .15s; }
@media (hover: hover) { .link:hover { text-decoration-color: currentColor; } }
:root .link { color: var(--accent); }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; }
.page-head > div { display: grid; gap: 4px; min-width: 0; }

/* ---------- Suche & Filter ---------- */
.tools { display: grid; gap: 12px; margin: 16px 0 26px; }
@media (min-width: 760px) { .tools { grid-template-columns: minmax(260px, 380px) 1fr; align-items: center; gap: 12px 16px; } }
.search { position: relative; display: flex; align-items: center; }
.search > .i { position: absolute; left: 14px; color: var(--fg-3); pointer-events: none; }
.search input {
  width: 100%; height: 50px; padding: 0 46px 0 44px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); font-size: 1rem; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--fg-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search input::-webkit-search-cancel-button { display: none; }
.search-clear { position: absolute; right: 6px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--fg-2); }
@media (hover: hover) { .search-clear:hover { background: var(--surface-2); } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-weight: 620; font-size: 0.9375rem; color: var(--fg); white-space: nowrap;
  transition: background .18s, border-color .18s, color .18s, transform .12s var(--ease);
}
.chip .i { width: 18px; height: 18px; color: var(--fg-2); transition: color .18s; }
.chip .chev { width: 16px; height: 16px; margin-right: -4px; transition: transform .2s var(--ease); }
.chip[aria-expanded="true"] .chev { transform: rotate(180deg); }
@media (hover: hover) { .chip:hover { border-color: color-mix(in oklab, var(--fg) 28%, var(--line)); } }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.chip.on .i { color: var(--accent-ink); }
.chip .tick { width: 0; margin-right: -7px; opacity: 0; transition: width .2s var(--ease), margin .2s var(--ease), opacity .15s; }
.chip.on .tick { width: 18px; margin-right: 0; opacity: 1; }

.pop {
  position: absolute; z-index: 40; min-width: 240px; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  box-shadow: 0 2px 4px rgb(var(--shadow) / .08), 0 20px 40px -14px rgb(var(--shadow) / .35);
  transform-origin: top left;
}
.pop.in { animation: popIn .18s var(--ease); }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
.pop-title { font-weight: 700; font-size: 0.9375rem; margin: 2px 4px 12px; }
.numgrid { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; }
.num, .pop-any, .pop-opt {
  height: 50px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: 1.0625rem;
  font-variant-numeric: tabular-nums; transition: background .15s, color .15s, transform .12s var(--ease);
}
@media (hover: hover) { .num:hover, .pop-any:hover, .pop-opt:hover { background: var(--surface-3); } }
.num:active, .pop-any:active, .pop-opt:active { transform: scale(.96); }
.num[aria-pressed="true"], .pop-any[aria-pressed="true"], .pop-opt[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pop-any[aria-pressed="true"], .pop-opt.any[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.pop-any { width: 100%; margin-top: 8px; font-size: 0.9375rem; font-weight: 650; height: 44px; }
.pop-list { display: grid; gap: 6px; min-width: 232px; }
.pop-opt { height: 46px; padding: 0 14px; text-align: left; font-size: 0.9688rem; font-weight: 620; display: flex; align-items: center; justify-content: space-between; }
.pop-opt .i { opacity: 0; }
.pop-opt[aria-pressed="true"] .i { opacity: 1; }
.acct { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.acct-name { font-weight: 700; }
.acct-role { color: var(--fg-2); font-size: 0.875rem; }
.pop-item { text-align: left; display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 10px; border-radius: 10px; font-weight: 600; color: var(--fg); }
@media (hover: hover) { .pop-item:hover { background: var(--surface-2); } }

/* ---------- Abschnitte, Kacheln, Regal ---------- */
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.section + .section { margin-top: 36px; }
.sec-head { display: grid; gap: 3px; }
.sec-head.inline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 14px; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 30px 22px; } }

.tile { display: flex; flex-direction: column; gap: 11px; min-width: 0; border-radius: 10px; text-align: left; }
.tile:focus-visible { outline-offset: 5px; }
.cover {
  position: relative; display: block; aspect-ratio: 1; max-width: 100%; border-radius: 7px; overflow: hidden; isolation: isolate;
  background: var(--tint, var(--surface-3));
  box-shadow: 0 3px 0 color-mix(in oklab, var(--tint, #888) 60%, #000), 0 12px 20px -12px rgb(var(--shadow) / .6);
  transition: transform .26s var(--ease), box-shadow .26s var(--ease);
}
.cover > svg { display: block; width: 100%; height: 100%; }
.cover::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), inset 0 1px 0 rgba(255, 255, 255, .28); background: linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 42%); }
.cover::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background-image: var(--grain); opacity: .22; mix-blend-mode: multiply; }
@media (hover: hover) {
  .tile:hover .cover { transform: translateY(-4px); box-shadow: 0 3px 0 color-mix(in oklab, var(--tint, #888) 60%, #000), 0 20px 26px -14px rgb(var(--shadow) / .6); }
}
.tile:active .cover { transform: translateY(0) scale(.975); transition-duration: .1s; }

.tile-title { font-weight: 680; font-size: 0.9688rem; line-height: 1.28; letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 11px; color: var(--fg-2); font-size: 0.8438rem; font-weight: 550; margin-top: -5px; font-variant-numeric: tabular-nums; }
.meta .m { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.meta .i { width: 15px; height: 15px; color: var(--fg-3); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line); }
.pips i.on { background: var(--fg-2); box-shadow: none; }

.pill {
  position: absolute; z-index: 2; left: 8px; top: 8px;
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
  font-size: 0.7812rem; font-weight: 700; letter-spacing: .005em; white-space: nowrap;
  background: var(--pb); color: var(--pi); box-shadow: 0 1px 2px rgba(0, 0, 0, .18), 0 0 0 1px rgba(255, 255, 255, .12);
}
.pill .i { width: 14px; height: 14px; stroke-width: 2.2; }
.t-lent { --pb: var(--lent-bg); --pi: var(--lent-ink); }
.t-res { --pb: var(--res-bg); --pi: var(--res-ink); }
.t-lock { --pb: var(--lock-bg); --pi: var(--lock-ink); }
.t-mine { --pb: var(--accent-soft); --pi: var(--accent-ink); }
.t-danger { --pb: var(--danger-bg); --pi: var(--danger); }
.t-ok { --pb: var(--surface-2); --pi: var(--fg-2); }

.sticker {
  position: absolute; z-index: 2; right: 7px; top: 7px; width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center; text-align: center; transform: rotate(-12deg);
  background: var(--sticker); color: var(--sticker-ink);
  font-family: var(--font-display); font-weight: 800; font-size: 0.7812rem; line-height: 1.02; letter-spacing: -.01em;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .28), inset 0 0 0 2px rgba(255, 255, 255, .4), inset 0 -3px 0 rgba(0, 0, 0, .08);
}

/* Leih-mich-Regal mit Brett */
.feature { --cov: 150px; --row-pt: 6px; }
@media (min-width: 760px) { .feature { --cov: 176px; } }
.shelf { position: relative; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
@media (min-width: 760px) { .shelf { margin-inline: 0; } }
.shelf::before {
  content: ""; position: absolute; z-index: 0; left: 0; right: 0;
  top: calc(var(--row-pt) + var(--cov) + 3px); height: 12px; border-radius: 3px;
  background: linear-gradient(var(--plank-top), var(--plank) 70%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .25) inset, 0 10px 14px -8px rgb(var(--shadow) / .45);
}
.shelf-row {
  position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: var(--cov); gap: 18px;
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: var(--row-pt) max(16px, env(safe-area-inset-left, 0px)) 4px;
  scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.shelf-row::-webkit-scrollbar { display: none; }
@media (min-width: 760px) { .shelf-row { padding-inline: 0; scrollbar-width: thin; gap: 24px; } }
.shelf-row .tile { scroll-snap-align: start; gap: 26px; }
.shelf-row .tile .cover { box-shadow: 0 3px 0 color-mix(in oklab, var(--tint, #888) 60%, #000), 0 2px 3px rgb(var(--shadow) / .25); }

/* Leerer Zustand */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 16px 24px; max-width: 460px; margin: 0 auto; }
.empty .h2 { margin-top: 10px; }
.empty .btn { margin-top: 10px; }
.mini-pile { position: relative; width: 150px; height: 104px; }
.mini-pile .cover { position: absolute; width: 72px; }

/* ---------- Buttons & Formulare ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 22px; border-radius: 14px; font-weight: 680; font-size: 1rem; white-space: nowrap;
  transition: background .16s, color .16s, box-shadow .16s, transform .12s var(--ease), opacity .16s;
  text-decoration: none;
}
.btn:active { transform: scale(.975); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 8px 18px -10px rgb(var(--shadow) / .7); }
@media (hover: hover) { .btn-primary:hover:not([disabled]) { background: var(--accent-press); } }
.btn-quiet { background: var(--surface-2); color: var(--fg); }
@media (hover: hover) { .btn-quiet:hover:not([disabled]) { background: var(--surface-3); } }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
@media (hover: hover) { .btn-danger:hover { filter: brightness(.97); } }
.btn-ghost { color: var(--fg-2); }
@media (hover: hover) { .btn-ghost:hover { background: var(--surface-2); color: var(--fg); } }
.btn-sm { height: 42px; padding: 0 16px; border-radius: 12px; font-size: 0.9375rem; }
.btn-block { width: 100%; }
.btn .i { width: 19px; height: 19px; }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--fg-2); transition: background .15s, color .15s, transform .12s var(--ease); }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); color: var(--fg); } }
.icon-btn:active { transform: scale(.94); }

.field { display: grid; gap: 8px; }
.label { font-weight: 680; font-size: 0.9375rem; }
.help { color: var(--fg-2); font-size: 0.875rem; }
.input, .textarea {
  width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s;
}
.input { height: 50px; padding: 0 14px; }
.textarea { min-height: 96px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
.input:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 0.875rem; font-weight: 600; }
.opt { color: var(--fg-3); font-weight: 500; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg button { height: 44px; padding: 0 6px; border-radius: 10px; font-weight: 640; font-size: 0.9375rem; color: var(--fg-2); transition: background .18s, color .18s, box-shadow .18s; }
@media (hover: hover) { .seg button:hover { color: var(--fg); } }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(var(--shadow) / .14), 0 3px 8px -3px rgb(var(--shadow) / .22); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }

/* View Transitions beim Filtern: Kacheln gleiten an ihren neuen Platz */
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-group(*) { animation-duration: .3s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
::view-transition-old(*):only-child { animation: vtOut .16s ease both; }
::view-transition-new(*):only-child { animation: vtIn .26s .06s var(--ease) both; }
@keyframes vtOut { to { opacity: 0; transform: scale(.94); } }
@keyframes vtIn { from { opacity: 0; transform: scale(.94); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .done-mark path { stroke-dashoffset: 0; }
}

/* =================== v3 =================== */

/* Stille Schachtelkante: Erweiterungen liegen hinter dem Cover */

.cover-wrap::before, .cover-wrap::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 7px;

/* Die Kanten ragen in den Zwischenraum nach rechts oben; alle Cover bleiben gleich groß */

.new-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); font-size: 0.75rem; font-weight: 750; letter-spacing: .01em; }

/* Umschalter Spiele | Puzzles */

/* Sortierung */

/* Wärmere, ruhigere Flächen. Tokens für Radien, Schatten und Bewegung, damit alles gleich atmet. */
:root {

}

/* Flächen: ein leiser Schatten statt harter Kanten */
.row, .person, .req, .tool-row, .option-card, .steps li, .pw-card, .lst-row, .xpick, .exp-box { box-shadow: var(--sh-xs); }

/* Spielerzahl mit Erweiterungen und geschätzte Dauer je Personenzahl */
function reach(g) {
  let max = g.players[1], via = null;
  expsOf(g).forEach(e => { const r = e.withBase || e.players; if (r[1] > max) { max = r[1]; via = e; } });
  return { min: g.players[0], max, via };
}
function estimate(g, p) {
  const [pmin, pmax] = g.players, [tmin, tmax] = g.time;
  if (p > pmax) { const r = reach(g); return r.via && r.via.time ? r.via.time[1] : tmax; }
  if (pmax === pmin || tmin === tmax) return tmax;
  const q = Math.min(Math.max(p, pmin), pmax);
  return Math.round((tmin + (q - pmin) / (pmax - pmin) * (tmax - tmin)) / 5) * 5;
}
const zuN = p => ({ 1: 'allein', 2: 'zu zweit', 3: 'zu dritt', 4: 'zu viert', 5: 'zu fünft', 6: 'zu sechst', 7: 'zu siebt' }[p] || 'zu acht');
const hrs = n => (n / 60).toLocaleString('de-AT', { maximumFractionDigits: 1 });

const playersText = g => (g.players[0] === g.players[1] ? `${g.players[0]}` : `${g.players[0]}–${g.players[1]}`);
const playersLong = g => (g.players[0] === g.players[1] ? (g.players[0] === 1 ? '1 Person' : `${g.players[0]} Personen`) : `${g.players[0]} bis ${g.players[1]} Personen`);
const timeText = g => { const [a, b] = g.time; if (b <= 90) return a === b ? `${a} Min` : `${a}–${b} Min`; return a === b ? `${hrs(a)} Std` : `${hrs(a)}–${hrs(b)} Std`; };
const timeLong = g => timeText(g).replace('Min', 'Minuten').replace('Std', 'Stunden').replace('–', ' bis ');
const pieceText = p => `${p.pieces.toLocaleString('de-AT')} Teile`;
const sizeText = p => `${p.size[0]} × ${p.size[1]} cm`;
const bestText = g => { const b = g.best; if (!b || (b[0] === g.players[0] && b[1] === g.players[1])) return ''; return `am besten mit ${b[0] === b[1] ? b[0] : b[0] + '–' + b[1]}`; };
const retText = l => (l.open ? 'ohne festes Rückgabedatum' : `zurück am ${listDates(l.ret)}`);

const TIMES = [[20, 'bis 20 Min'], [30, 'bis 30 Min'], [45, 'bis 45 Min'], [60, 'bis 1 Std'], [90, 'bis 1½ Std'], [120, 'bis 2 Std'], [999, 'länger als 2 Std']];

/* Trifft ein Spiel? Gibt Zusatzinfos zurück: gefundene Erweiterung, Spielerzahl nur mit Erweiterung, geschätzte Dauer */
function gameHit(g, f = S.f, q = S.q) {
  const res = { note: '', viaExp: null, est: null };
  const qq = q.trim();
  if (qq && !textMatch(g.title, qq)) {
    const e = expsOf(g).find(x => textMatch(x.title, qq));
    if (!e) return null;
    res.note = `Mit Erweiterung: ${shortExp(e)}`;
  }
  const p = f.players ? Math.min(f.players, 8) : null;
  if (p) {
    const inBase = f.players >= 8 ? g.players[1] >= 8 : (p >= g.players[0] && p <= g.players[1]);
    if (!inBase) {
      const r = reach(g);
      const ok = r.via && (f.players >= 8 ? r.max >= 8 : p >= r.min && p <= r.max);
      if (!ok) return null;
      res.viaExp = r.via;
    }
    res.est = estimate(g, p);
  }
  if (f.time) {
    if (f.time === 999) { if (!((res.est ?? g.time[1]) > 120)) return null; }
    else if ((res.est ?? g.time[0]) > f.time) return null;
  }
  if (f.avail && !isAvailable(g)) return null;
  if (f.genres.length && !f.genres.some(x => (g.genres || []).includes(x))) return null;
  if (f.diff && g.diff !== f.diff) return null;
  if (f.age && g.age > f.age) return null;
  if (f.gift && !g.gift) return null;
  return res;
}
function puzzleHit(p, f = S.pf, q = S.q) {
  const qq = q.trim();
  if (qq && !textMatch(p.title, qq) && !textMatch(p.brand, qq) && !textMatch(p.motif, qq)) return null;
  if (f.pieces === 500 && p.pieces > 500) return null;
  if (f.pieces === 1000 && (p.pieces <= 500 || p.pieces > 1000)) return null;
  if (f.pieces === 1001 && p.pieces <= 1000) return null;
  if (f.avail && !isAvailable(p)) return null;
  if (f.motifs.length && !f.motifs.includes(p.motif)) return null;
  if (f.brands.length && !f.brands.includes(p.brand)) return null;
  return { note: '' };
}

  const mine = myOpen(), dec = myDeclined(), rec = recentReturns(), hist = historyOf(S.user), lists = myLists().filter(li => li.ids.some(id => gameById(id) && !gameById(id).archived));
  const wishes = S.gifts.filter(w => w.userId === S.user);
  const head = `<div class="page-head"><div><h1 class="h1" tabindex="-1">Meine Ausleihen</h1><p class="sub">Was du gerade hast und was du angefragt hast.</p></div></div>`;
  let h = head;
  const res = mine.filter(l => l.status === 'reserviert').sort((a, b) => (a.start || T0) - (b.start || T0));
  const back = mine.filter(l => l.status === 'vorgemerkt' && l.notified);
  const bei = mine.filter(l => l.status === 'verliehen').sort((a, b) => (dueOf(a) ?? FAR) - (dueOf(b) ?? FAR));
  const req = mine.filter(l => l.status === 'angefragt' || (l.status === 'vorgemerkt' && !l.notified));
  const active = res.length + back.length + dec.length + bei.length + req.length + wishes.length + rec.length;
  if (!active) {
    h += `<div class="empty"><div class="mini-pile" aria-hidden="true">${miniPile()}</div><h2 class="h2">Du hast gerade nichts ausgeliehen</h2><p class="sub">Im Regal findest du alles, was Jakob verleiht.</p><button class="btn btn-primary" data-act="tab" data-tab="regal">Zum Regal</button></div>`;
  }
  if (res.length) h += sec('Abholbereit', res.length, `<div class="list">${res.map(l => rowHTML(l, l.start && l.start > T0 ? `Für dich reserviert ab ${esc(fdw(l.start))}` : `Für dich reserviert, ${esc(retText(l))}`, `<button class="btn btn-ghost btn-sm" data-act="cancel-res" data-id="${l.id}">Absagen</button>`)).join('')}</div>`);
  if (back.length) h += sec('Wieder da', back.length, `<div class="list">${back.map(l => rowHTML(l, 'Jakob verleiht es wieder. Wann möchtest du es?', `<button class="btn btn-primary btn-sm" data-act="pick-period" data-id="${l.id}">${ic('cal')}Zeitraum wählen</button>`)).join('')}</div>`);
  if (dec.length) h += sec('Abgelehnt', dec.length, `<div class="list">${dec.map(l => rowHTML(l, l.reason ? `Jakob: „${esc(l.reason)}“` : 'Jakob hat deine Anfrage abgelehnt.', `<button class="btn btn-ghost btn-sm" data-act="dismiss" data-id="${l.id}">Ausblenden</button>`, '', { stacked: true })).join('')}</div>`);
  if (bei.length) h += sec('Bei dir', bei.length, `<div class="list">${bei.map(l => {
    const acts = (canExtend(l) ? iconBtn('extend', l.id, 'calplus', 'Um zwei Wochen verlängern') : '') + iconBtn('photos', l.id, 'camera', 'Fotos vom Spieleabend teilen');
    const extLine = { angefragt: '<br><span class="sep">Verlängerung angefragt</span>', ok: '<br><span class="sep">Um zwei Wochen verlängert</span>', abgelehnt: '<br><span class="sep">Verlängerung nicht angenommen</span>' }[l.ext] || '';
    /* Einmal pro Ausleihe, ein paar Tage nach der Übergabe: ein leiser Hinweis auf die Fotos */
    const hint = !l.photoHint && !photosOfLoan(l).length && l.handed && -dnum(l.handed) >= 3
      ? `<div class="row-hint">${ic('camera')}<p>Hattet ihr einen schönen Abend mit ${esc(gameById(l.gameId).title)}? Wenn du magst, kannst du Jakob <button class="inline-link" data-act="photos" data-id="${l.id}">Fotos schicken</button>.</p>${iconBtn('hint-dismiss', l.id, 'x', 'Hinweis ausblenden')}</div>` : '';
    if (overdue(l)) return rowHTML(l, `Rückgabe war am ${fd(dueOf(l))} geplant`, acts, 'danger', { after: hint });
    if (l.open) return rowHTML(l, 'Ohne festes Rückgabedatum', acts, '', { after: hint });
    return rowHTML(l, `Zurück am ${esc(listDates(l.ret))}${extLine}`, acts, '', { after: hint });
  }).join('')}</div><p class="list-note">Die Rückgabe trägt Jakob ein, sobald er das Spiel wieder hat.</p>`);
  if (req.length || wishes.length) h += sec('Angefragt', req.length + wishes.length, `<div class="list">${req.map(l => {
    const line = l.status === 'vorgemerkt' ? `Vorgemerkt, du bist Nummer ${queuePos(l)} in der Reihe` : `Ab ${esc(fdw(l.start))}, ${esc(retText(l))}`;
    return rowHTML(l, line, `<button class="btn btn-ghost btn-sm" data-act="withdraw" data-id="${l.id}">Zurückziehen</button>`);
  }).join('')}${wishes.map(w => rowHTML({ gameId: w.gameId, extras: [] }, 'Du hättest es gern. Jakob entscheidet, wer es bekommt.', `<button class="btn btn-ghost btn-sm" data-act="unwish" data-id="${w.gameId}">Zurückziehen</button>`)).join('')}</div>`);
  if (rec.length) h += sec('Zuletzt zurückgegeben', null, `<div class="list">${rec.map(l => {
    const ph = photosOfLoan(l), liked = ph.some(p => p.liked);
    const line = liked ? 'Jakob hat sich über deine Fotos gefreut.' : ph.length ? 'Danke für die Fotos!' : `Zurückgegeben am ${esc(fd(l.returned))}`;
    return rowHTML(l, line, iconBtn('photos', l.id, 'camera', 'Fotos vom Spieleabend teilen'), liked ? 'ok' : '');
  }).join('')}</div>`);
  if (lists.length) h += sec('Meine Listen', null, lists.map(li => {
    const items = li.ids.map(gameById).filter(g => g && !g.archived);
    return `<div class="list-block"><p class="list-name">${esc(li.name)}<small>${items.length}</small></p><div class="cover-row">${items.map(g => `<button class="${isPuzzle(g) ? 'pz' : ''}" data-act="open-game" data-id="${g.id}" aria-label="${esc(g.title)}">${coverEl(g)}</button>`).join('')}</div></div>`;
  }).join(''));
  if (hist.length) h += `<details class="history" id="history"><summary>${ic('clock')}Früher ausgeliehen (${hist.length})${ic('chev', 'chev')}</summary><ul class="hist-list">${hist.map(l => {
    const g = gameById(l.gameId), d = dnum(l.returned) - dnum(l.handed || l.start);
    return `<li>${coverEl(g)}<span><b>${esc(titleOf(l))}</b><small>${esc(rangeText(l.handed || l.start, l.returned))}</small></span><em>${daysWord(Math.max(1, d))}</em></li>`;
  }).join('')}</ul></details>`;
  return h;
}

/* ---------- Verwalten ---------- */
function verwaltenHTML() {
  const orts = [...new Set(S.users.filter(u => !u.admin && u.ort).map(u => u.ort))].sort((a, b) => a.localeCompare(b, 'de'));
  const loansIn = st => S.loans.filter(l => l.status === st && inOrt(l.userId));
  const reqs = loansIn('angefragt').sort((a, b) => a.created - b.created);
  const exts = extRequests().filter(l => inOrt(l.userId));
  const gifts = giftGroups().map(id => [gameById(id), wishesFor(id).filter(w => inOrt(w.userId))]).filter(x => x[1].length);
  const resv = loansIn('reserviert').sort((a, b) => (a.start || T0) - (b.start || T0));
  const lent = loansIn('verliehen').sort((a, b) => (overdue(b) - overdue(a)) || ((dueOf(a) ?? FAR) - (dueOf(b) ?? FAR)));
  const freeQ = live().filter(g => !current(g.id) && queue(g.id).length && inOrt(queue(g.id)[0].userId));
  const outQ = live().filter(g => current(g.id) && queue(g.id).length).filter(g => queue(g.id).some(l => inOrt(l.userId)));
  const photos = S.photos.filter(p => -dnum(p.created) <= 30 && inOrt(p.userId)).sort((a, b) => b.created - a.created);
  const openCount = uid => S.loans.filter(l => l.userId === uid && OPEN.includes(l.status)).length + S.gifts.filter(w => w.userId === uid).length;
  const ortCount = o => S.users.filter(u => u.ort === o).reduce((n, u) => n + openCount(u.id), 0);

  let h = `<div class="page-head"><div><h1 class="h1" tabindex="-1">Verwalten</h1><p class="sub">Anfragen, Übergaben und wer gerade was hat.</p></div><button class="btn btn-primary btn-sm" data-act="add-item">${ic('plus')}Hinzufügen</button></div>`;
  if (orts.length) {
    let sum = '';
    if (S.ort) {
      const parts = [];
      if (lent.length) parts.push(`${lent.length} verliehen`);
      if (resv.length) parts.push(`${resv.length} zur Übergabe`);
      if (reqs.length + exts.length) parts.push(`${reqs.length + exts.length} ${reqs.length + exts.length === 1 ? 'Anfrage' : 'Anfragen'}`);
      sum = `<p class="ort-sum">${parts.length ? `In ${esc(S.ort)}: ${parts.join(', ')}.` : `In ${esc(S.ort)} ist gerade nichts unterwegs.`}</p>`;
    }
    h += `<div class="ort-bar"><div class="ort-chips" role="group" aria-label="Nach Ort filtern"><button class="chip ${!S.ort ? 'on' : ''}" id="ort-all" data-act="ort" data-v="" aria-pressed="${!S.ort}">${ic('pin')}<span>Alle Orte</span></button>${orts.map((o, i) => `<button class="chip ${S.ort === o ? 'on' : ''}" id="ort-${i}" data-act="ort" data-v="${esc(o)}" aria-pressed="${S.ort === o}"><span>${esc(o)}</span><small>${ortCount(o)}</small></button>`).join('')}</div>${sum}</div>`;
  }
  const nReq = reqs.length + exts.length + gifts.length;
  h += sec('Anfragen', nReq, nReq ? `<div class="list">${reqs.map(reqCard).join('')}${exts.map(extCard).join('')}${gifts.map(([g, w]) => giftCard(g, w)).join('')}</div>` : `<p class="quiet-empty">${S.ort ? `Keine offenen Anfragen aus ${esc(S.ort)}.` : 'Keine offenen Anfragen. Alles erledigt.'}</p>`);
  if (freeQ.length) h += sec('Wieder da, vorgemerkt', freeQ.filter(g => !queue(g.id)[0].notified).length || null, `<div class="list">${freeQ.map(g => {
    const q = queue(g.id), first = q[0];
    const names = q.map(l => uname(l.userId)).join(', dann ');
    return first.notified
      ? rowHTML({ gameId: g.id, extras: [] }, `${esc(uname(first.userId))} weiß Bescheid und wählt einen Zeitraum.`)
      : rowHTML({ gameId: g.id, extras: [] }, `Vorgemerkt: ${esc(names)}`, `<button class="btn btn-primary btn-sm" data-act="notify" data-id="${first.id}">${ic('chat')}${esc(uname(first.userId))} Bescheid geben</button>`);
  }).join('')}</div><p class="list-note">Erst wenn du Bescheid gibst, kann die erste Person in der Reihe ihren Zeitraum wählen.</p>`);
  if (resv.length) h += sec('Zur Übergabe', resv.length, `<div class="list">${resv.map(l => rowHTML(l, `Für ${whoOrt(l.userId)}, ${l.start && l.start > T0 ? `ab ${esc(fdw(l.start))}` : 'ab heute'}`, `<button class="btn btn-primary btn-sm" data-act="handover" data-id="${l.id}">${ic('hand')}Übergeben</button>`)).join('')}</div>`);
  h += sec('Verliehen', lent.length, lent.length ? `<div class="list">${lent.map(l => {
    const who = esc(uname(l.userId));
    const line = overdue(l) ? `Bei ${whoOrt(l.userId)}, seit ${fd(dueOf(l))} fällig` : l.open ? `Bei ${whoOrt(l.userId)}, offen` : `Bei ${whoOrt(l.userId)}, zurück am ${esc(listDates(l.ret))}`;
    const vis = `<button class="icon-btn" data-act="toggle-vis" data-id="${l.id}" aria-pressed="${l.pub}" aria-label="${l.pub ? 'Für alle sichtbar. Antippen, um es nur für dich und ' + who + ' zu zeigen.' : 'Nur für dich und ' + who + ' sichtbar. Antippen, um es allen zu zeigen.'}" title="${l.pub ? 'Für alle sichtbar' : 'Nur für dich und ' + who + ' sichtbar'}">${ic(l.pub ? 'eye' : 'eyeoff')}</button>`;
    const remind = overdue(l) ? `<a class="btn btn-ghost btn-sm" href="${esc(waLink(l.userId, `Hallo ${uname(l.userId)}, hast du „${titleOf(l)}“ noch? Kein Stress, sag einfach, wann es dir passt.`))}" target="_blank" rel="noopener">${ic('chat')}Erinnern</a>` : '';
    return rowHTML(l, line, remind + vis + `<button class="btn btn-quiet btn-sm" data-act="return" data-id="${l.id}">Zurückbekommen</button>`, overdue(l) ? 'danger' : '');
  }).join('')}</div>` : `<p class="quiet-empty">${S.ort ? `In ${esc(S.ort)} ist gerade nichts verliehen.` : 'Gerade ist nichts verliehen.'}</p>`);
  if (outQ.length) h += sec('Vorgemerkt', null, `<div class="list">${outQ.map(g => {
    const cur = current(g.id);
    return rowHTML({ gameId: g.id, extras: [] }, `Vorgemerkt: ${esc(queue(g.id).map(l => uname(l.userId)).join(', dann '))}. Gerade bei ${esc(uname(cur.userId))}.`);
  }).join('')}</div>`);
  if (photos.length) h += sec('Fotos vom Spieleabend', null, `<div class="list">${photos.map(photoCard).join('')}</div>`);
  if (S.access.length && !S.ort) h += sec('Zugangsanfragen', S.access.length, `<div class="list">${S.access.map(a => `<div class="person">${avatar({ ini: a.name.replace(/^(Oma|Opa|Onkel|Tante) /, '').charAt(0).toUpperCase(), av: 6 })}<div class="person-text"><b>${esc(a.name)}</b><span>${esc(a.contact)}, ${ago(a.created)}</span></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-act="access-decline" data-id="${a.id}">Ablehnen</button><button class="btn btn-primary btn-sm" data-act="access-accept" data-id="${a.id}">Zugang anlegen</button></div></div>`).join('')}</div>`);
  const people = S.users.filter(u => !u.admin && inOrt(u.id));
  h += sec('Personen', people.length, `<div class="list">${people.map(u => `<div class="person">${avatar(u)}<div class="person-text"><b>${esc(u.name)}</b><span>${u.ort ? `${esc(u.ort)}, ` : ''}Benutzername: ${esc(u.username)}</span></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-act="edit-person" data-id="${u.id}">Bearbeiten</button><button class="btn btn-ghost btn-sm" data-act="reset-pw" data-id="${u.id}">Neues Passwort</button></div></div>`).join('')}</div>`, `<button class="btn btn-quiet btn-sm" data-act="add-person">${ic('userplus')}Person hinzufügen</button>`);
  const noRules = live().filter(g => !isPuzzle(g) && !g.rules).length, gifted = S.games.filter(g => g.archived && g.giftedTo).length;
  h += sec('Werkzeuge', null, `<div class="tools-list">
    <button class="tool-row" data-act="catalog">${ic('book')}<span><b>Katalog erstellen</b><span>Deine Sammlung als PDF, auf Knopfdruck.</span></span>${ic('next')}</button>
    <button class="tool-row" data-act="link">${ic('link')}<span><b>Schaufenster-Link</b><span>Abgespeckte Ansicht für alle ohne Zugang.</span></span>${ic('next')}</button>
    <button class="tool-row" data-act="rules-list">${ic('doc')}<span><b>Ohne Regelheft</b><span>${noRules === 1 ? '1 Spiel oder Erweiterung' : `${noRules} Spiele und Erweiterungen`}</span></span>${ic('next')}</button>
    ${gifted ? `<button class="tool-row" data-act="gifted-list">${ic('gift')}<span><b>Verschenkt</b><span>${gifted === 1 ? '1 Spiel' : `${gifted} Spiele`}</span></span>${ic('next')}</button>` : ''}
    <button class="tool-row" data-act="settings">${ic('gear')}<span><b>Einstellungen</b><span>Neu-Markierung: ${S.settings.newWeeks} Wochen</span></span>${ic('next')}</button>
  </div>`);
  return h;
}
function reqHead(u, text, g, meta) {
  return `<div class="req-top">${avatar(u)}
      <div class="req-text"><p>${text}</p><p class="req-meta">${meta}</p></div>
      ${coverEl(g)}
    </div>`;
}
function reqCard(l) {
  const g = gameById(l.gameId), u = userById(l.userId);
  const cur = current(g.id), conflict = busyOf([g.id, ...l.extras], l.id).some(([a, b]) => l.start <= b && maxD(l.ret) >= a);
  const ex = l.extras.map(gameById).filter(Boolean);
  const actions = S.declining === l.id
    ? `<div class="decline"><label class="label" for="dr-${l.id}">Kurzer Grund für ${esc(u.name)} <span class="opt">(optional)</span></label><textarea class="textarea" id="dr-${l.id}" rows="2" placeholder="Zum Beispiel: Brauche ich am Wochenende selbst."></textarea><div class="req-actions"><button class="btn btn-ghost btn-sm" data-act="decline-cancel">Abbrechen</button><button class="btn btn-danger btn-sm" data-act="decline-confirm" data-id="${l.id}">Ablehnen</button></div></div>`
    : `<div class="req-actions"><button class="btn btn-quiet btn-sm" data-act="decline" data-id="${l.id}">Ablehnen</button><button class="btn btn-primary btn-sm" data-act="accept" data-id="${l.id}">Annehmen</button></div>`;
  return `<article class="req" aria-label="Anfrage von ${esc(u.name)}">
    ${reqHead(u, `<strong>${whoOrt(u.id)}</strong> möchte <button class="inline-link" data-act="open-game" data-id="${g.id}">${esc(g.title)}</button>${ex.length ? ` mit ${esc(ex.map(shortExp).join(' und '))}` : ''} ausleihen.`, g, `<span class="m">${ic('cal')}${esc(tidy(`Ab ${fdw(l.start)}, zurück am ${listDates(l.ret)}`))}</span><span>${ago(l.created)}</span>`)}
    ${l.msg ? `<p class="bubble">${esc(l.msg)}</p>` : ''}
    ${conflict ? `<p class="req-note">${ic('glass')}<span>${cur ? `Gerade bei ${esc(uname(cur.userId))}.` : 'Der Zeitraum überschneidet sich mit einer anderen Zusage.'} Beim Annehmen kannst du einen anderen Zeitraum wählen.</span></p>` : ''}
    ${actions}
  </article>`;
}
function extCard(l) {
  const g = gameById(l.gameId), u = userById(l.userId), q = queue(g.id);
  const next = l.ret.map(d => addDays(d, EXTDAYS));
  return `<article class="req" aria-label="Verlängerung von ${esc(u.name)}">
    ${reqHead(u, `<strong>${whoOrt(u.id)}</strong> möchte <button class="inline-link" data-act="open-game" data-id="${g.id}">${esc(titleOf(l))}</button> um zwei Wochen verlängern.`, g, `<span class="m">${ic('calplus')}${esc(tidy(`Neu: zurück am ${listDates(next)}`))}</span>`)}
    ${q.length ? `<p class="req-note">${ic('inbox')}<span>${esc(q.map(x => uname(x.userId)).join(', '))} ${q.length === 1 ? 'hat' : 'haben'} vorgemerkt.</span></p>` : ''}
    <div class="req-actions"><button class="btn btn-quiet btn-sm" data-act="ext-decline" data-id="${l.id}">Ablehnen</button><button class="btn btn-primary btn-sm" data-act="ext-accept" data-id="${l.id}">Verlängern</button></div>
  </article>`;
}
function giftCard(g, wishes) {
  const names = wishes.map(w => uname(w.userId));
  const text = names.length === 1 ? `<strong>${esc(names[0])}</strong> hätte` : `<strong>${esc(names.slice(0, -1).join(', '))}</strong> und <strong>${esc(names[names.length - 1])}</strong> hätten`;
  return `<article class="req" aria-label="Wünsche zu ${esc(g.title)}">
    ${reqHead(userById(wishes[0].userId), `${text} gern <button class="inline-link" data-act="open-game" data-id="${g.id}">${esc(g.title)}</button>.`, g, `<span class="m">${ic('gift')}Zu verschenken</span><span>${ago(wishes[wishes.length - 1].created)}</span>`)}
    <div class="req-actions">${wishes.map(w => `<button class="btn btn-quiet btn-sm" data-act="give" data-id="${g.id}" data-u="${w.userId}">An ${esc(uname(w.userId))} verschenken</button>`).join('')}</div>
  </article>`;
}
function photoCard(p) {
  const u = userById(p.userId), g = gameById(p.gameId);
  return `<article class="req" aria-label="Fotos von ${esc(u.name)}">
    <div class="req-top">${avatar(u)}
      <div class="req-text"><p><strong>${esc(u.name)}</strong> hat ${p.urls.length === 1 ? 'ein Foto' : `${p.urls.length} Fotos`} zu <button class="inline-link" data-act="open-game" data-id="${g.id}">${esc(g.title)}</button> geschickt.</p><p class="req-meta"><span>${ago(p.created)}</span></p></div>
      <button class="heart" id="heart-${p.id}" data-act="heart" data-id="${p.id}" aria-pressed="${p.liked}" aria-label="${p.liked ? 'Gefällt dir. Nochmal antippen zum Zurücknehmen.' : `${esc(u.name)} zeigen, dass du dich freust`}" title="${p.liked ? 'Gefällt dir' : 'Freut mich'}">${ic('heart')}</button>
    </div>
    ${p.caption ? `<p class="bubble">${esc(p.caption)}</p>` : ''}
    <div class="thumbs">${p.urls.map((url, i) => `<img src="${esc(url)}" alt="Foto ${i + 1} von ${esc(u.name)} zu ${esc(g.title)}">`).join('')}</div>
  </article>`;
}

/* ---------- Blatt (Handy) bzw. Seitenpanel (Desktop) ---------- */
const sheetRoot = $('#sheet'), sheetPanel = $('#sheet-panel'), sheetBody = $('#sheet-body'), sheetFoot = $('#sheet-foot');
let lastFocus = null, lastKey = null, closeTimer = null;
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (el.matches('#view .h1')) return '#view .h1';
  if (el.dataset && el.dataset.act) return `[data-act="${el.dataset.act}"]` + (el.dataset.id ? `[data-id="${el.dataset.id}"]` : '');
  return null;
}
function restoreFocus(el, key) {
  if (!el || el === document.body) return;
  if (document.contains(el) && el.offsetParent !== null) { el.focus({ preventScroll: true }); return; }
  const k = key && document.querySelector(key);
  (k && k.offsetParent !== null ? k : $('#view .h1') || $('#app .h1'))?.focus({ preventScroll: true });
}
function openSheet(view, { focus = 'title' } = {}) {
  closePop(false);
  const wasOpen = !sheetRoot.hidden && sheetRoot.classList.contains('open');
  S.sheetView = view;
  paintSheet(wasOpen);
  if (!wasOpen) {
    clearTimeout(closeTimer);
    lastFocus = document.activeElement; lastKey = focusKey(lastFocus);
    sheetRoot.hidden = false;
    document.documentElement.classList.add('lock', 'sheet-open');
    sheetBody.scrollTop = 0;
    void sheetPanel.offsetWidth;
    sheetRoot.classList.add('open');
  } else sheetBody.scrollTop = 0;
  requestAnimationFrame(() => { (focus === 'title' ? $('#sheet-title') : $(focus))?.focus({ preventScroll: true }); });
}
/* Trennlinie über dem Fuß nur, solange darunter noch Inhalt steht */
const footEdge = () => sheetPanel.classList.toggle('more', !sheetFoot.hidden && sheetBody.scrollHeight - sheetBody.clientHeight - sheetBody.scrollTop > 4);
sheetBody.addEventListener('scroll', footEdge, { passive: true });
function paintSheet(step) {
  const v = S.sheetView(); if (!v) return;
  sheetBody.innerHTML = v.body;
  sheetFoot.innerHTML = v.foot || '';
  sheetFoot.hidden = !v.foot;
  requestAnimationFrame(footEdge);
  if (step && !reduce()) [sheetBody, sheetFoot].forEach(el => { el.classList.remove('step-in'); void el.offsetWidth; el.classList.add('step-in'); });
}
function rerenderSheet() {
  if (!S.sheetView) return;
  const fid = document.activeElement && sheetPanel.contains(document.activeElement) ? document.activeElement.id : null;
  const st = sheetBody.scrollTop;
  sheetBody.classList.remove('step-in'); sheetFoot.classList.remove('step-in');
  paintSheet(false);
  sheetBody.scrollTop = st;
  if (fid) { const el = document.getElementById(fid); if (el && !el.disabled) el.focus({ preventScroll: true }); else $('#sheet-title')?.focus({ preventScroll: true }); }
}
function closeSheet() {
  if (sheetRoot.hidden) return;
  sheetRoot.classList.remove('open');
  S.sheetView = null; S.form = {}; S.undo = null; S.expOpen = false;
  document.documentElement.classList.remove('sheet-open');
  const done = () => {
    if (sheetRoot.classList.contains('open')) return;
    sheetRoot.hidden = true; sheetBody.innerHTML = ''; sheetFoot.innerHTML = '';
    document.documentElement.classList.remove('lock');
  };
  clearTimeout(closeTimer);
  closeTimer = setTimeout(done, reduce() ? 0 : 460);
  restoreFocus(lastFocus, lastKey);
}
const sheetOpen = () => !sheetRoot.hidden && sheetRoot.classList.contains('open');

/* Wischen zum Schließen (nur Handy) */
(() => {
  let drag = null;
  const grab = $('#sheet-grab'), scrim = sheetRoot.querySelector('.scrim');
  grab.addEventListener('pointerdown', e => {
    if (!isMobile()) return;
    drag = { y0: e.clientY, t0: performance.now(), dy: 0 };
    grab.setPointerCapture(e.pointerId);
    sheetPanel.classList.add('dragging');
  });
  grab.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.dy = Math.max(0, e.clientY - drag.y0);
    sheetPanel.style.transform = `translateY(${drag.dy}px)`;
    scrim.style.opacity = String(1 - Math.min(drag.dy / 420, .7));
  });
  const end = () => {
    if (!drag) return;
    const v = drag.dy / Math.max(1, performance.now() - drag.t0);
    sheetPanel.classList.remove('dragging');
    sheetPanel.style.transform = ''; scrim.style.opacity = '';
    if (drag.dy > 110 || (v > .55 && drag.dy > 24)) closeSheet();
    drag = null;
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
})();

function gameView(id) {

    const rec = g.rec ? `<p class="rec">${ic('chat')}<span><b>Jakobs Tipp:</b> ${esc(g.rec)}</span></p>` : '';

    let once = '';

/* ---------- Kalender: Abholtag plus ein bis drei Rückgabetage innerhalb von drei Wochen ---------- */
/* Rollendes Raster aus fünf Wochen statt Monatsblättern: Abholtag plus drei Wochen passen immer auf einen Blick,
   auch über ein Monatsende hinweg. */
const WEEKS = 5, DAYS_AHEAD = 120;
const startDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const MSHORT = new Intl.DateTimeFormat('de-AT', { month: 'short' });
const MLONG = new Intl.DateTimeFormat('de-AT', { month: 'long' });
function rangeLabel(a, b) {
  if (a.getMonth() === b.getMonth()) return MF.format(a);
  if (a.getFullYear() === b.getFullYear()) return `${MLONG.format(a)} und ${MF.format(b)}`;
  return `${MF.format(a)} und ${MF.format(b)}`;
}
/* Nach der Wahl des Abholtags rückt das Raster nach, falls der erlaubte Zeitraum sonst nicht ganz sichtbar wäre */
function fitAnchor(F) {
  const start = F.fixedStart ? T0 : F.start; if (!start) return;
  const last = addDays(F.anchor, WEEKS * 7 - 1), lim = calLimit(F);
  if (start < F.anchor || (lim && lim > last)) F.anchor = mondayOf(start);
}
function calLimit(F) {
  const start = F.fixedStart ? T0 : F.start; if (!start) return null;
  let lim = addDays(start, MAXDAYS);
  const nb = (F.busy || []).map(r => startDay(r[0])).filter(a => a > start).sort((a, b) => a - b)[0];
  if (nb && addDays(nb, -1) < lim) lim = addDays(nb, -1);
  return lim;
}
const inBusy = (F, d) => (F.busy || []).some(([a, b]) => d >= startDay(a) && d <= startDay(b));
/* Warum ein Tag nicht geht: wird beim Antippen eines gesperrten Tages angezeigt */
function dayReason(F, d) {
  const start = F.fixedStart ? T0 : F.start;
  if (d < T0) return 'Dieser Tag ist schon vorbei.';
  if (inBusy(F, d)) return 'An diesem Tag ist es schon vergeben.';
  if (F.fixedStart && same(d, start)) return 'Es geht heute los. Tipp auf die Rückgabetage.';
  const lim = calLimit(F);
  if (start && lim && d > lim) return lim < addDays(start, MAXDAYS) ? `Ab ${fdw(addDays(lim, 1))} ist es schon wieder vergeben.` : 'Höchstens drei Wochen ab dem Abholtag.';
  return 'Dieser Tag geht leider nicht.';
}
function dayState(F, d) {
  const start = F.fixedStart ? T0 : F.start, past = d < T0, busy = inBusy(F, d);
  const isStart = same(d, start), isRet = (F.ret || []).some(r => same(r, d));
  let enabled;
  if (!start) enabled = !past && !busy;
  else if (F.fixedStart) enabled = d > start && d <= calLimit(F);
  else if (isStart) enabled = true;
  else if (d < start) enabled = !past && !busy;
  else enabled = d <= calLimit(F);
  return { busy, isStart, isRet, enabled };
}
function calStep(F) {
  const n = (F.ret || []).length;
  if (!F.fixedStart && !F.start) return F.who === 'member' ? 'Tipp auf den Tag, ab dem du es brauchst.' : 'Tipp auf den Tag, ab dem es verliehen ist.';
  if (n === 0) return F.who === 'member' ? 'Jetzt bis zu drei Tage antippen, an denen du es zurückbringen kannst.' : 'Jetzt bis zu drei mögliche Rückgabetage antippen.';
  if (n < 3) return `Du kannst noch ${n === 2 ? 'einen Tag' : 'zwei Tage'} dazunehmen. Musst du aber nicht.`;
  return 'Drei Rückgabetage gewählt.';
}
function calSum(F) {
  const start = F.fixedStart ? T0 : F.start; if (!start) return '';
  const r = F.ret || [], ds = r.length ? `<b>${esc(listDates(r))}</b>` : '';
  let text;
  if (F.who === 'member') text = `Du holst es ab <b>${esc(fdw(start))}</b>${r.length ? ` und bringst es am ${ds} zurück` : ''}.`;
  else if (F.fixedStart) text = `Ab heute verliehen${r.length ? `, zurück am ${ds}` : ''}.`;
  else text = `Ab <b>${esc(fdw(start))}</b>${r.length ? `, zurück am ${ds}` : ''}.`;
  return `<div class="cal-sum"><span>${tidy(text).replace(/\.<\/b>\./g, '.</b>')}</span>${!F.fixedStart ? `<button class="link" id="cal-reset" data-act="cal-reset">Anderen Abholtag wählen</button>` : ''}</div>`;
}
function calHTML(F) {
  const start = F.fixedStart ? T0 : F.start, lastRet = F.ret?.length ? maxD(F.ret) : null;
  const days = Array.from({ length: WEEKS * 7 }, (_, i) => addDays(F.anchor, i));
  const states = days.map(d => dayState(F, d));
  let fi = days.findIndex(d => same(d, F.focus));
  if (fi < 0) fi = days.findIndex((d, i) => same(d, start) && states[i].enabled);
  if (fi < 0) fi = states.findIndex(s => s.enabled);
  let cells = '';
  days.forEach((d, i) => {
    const s = states[i], inR = start && lastRet && d >= startDay(start) && d <= lastRet;
    const cls = ['cal-day', s.isStart && 'is-start', s.isRet && 'is-ret', s.busy && 'is-busy', same(d, T0) && 'is-today', inR && 'in-range', inR && same(d, start) && 'range-start', inR && same(d, lastRet) && 'range-end'].filter(Boolean).join(' ');
    const lab = `${fdl(d)}${s.isStart ? (F.fixedStart ? ', heute' : ', Abholtag') : ''}${s.isRet ? ', Rückgabetag' : ''}${s.busy ? ', schon vergeben' : ''}${s.enabled ? '' : ', nicht wählbar'}`;
    const firstOfM = d.getDate() === 1;
    cells += `<button class="${cls}${firstOfM ? ' m1' : ''}" id="cd-${isoD(d)}" data-act="cal-pick" data-d="${isoD(d)}" aria-label="${esc(lab)}" aria-pressed="${s.isStart || s.isRet}" tabindex="${i === fi ? 0 : -1}" ${s.enabled ? '' : 'aria-disabled="true"'}><span>${d.getDate()}${firstOfM ? `<small>${esc(MSHORT.format(d))}</small>` : ''}</span></button>`;
  });
  const canPrev = F.anchor > mondayOf(T0), canNext = dnum(addDays(F.anchor, 28)) <= DAYS_AHEAD;
  return `<div class="cal" id="cal">
    <p class="cal-step" id="cal-step" aria-live="polite">${esc(calStep(F))}</p>
    <div class="cal-head"><button class="icon-btn" id="cal-prev" data-act="cal-prev" aria-label="Frühere Wochen" ${canPrev ? '' : 'disabled'}>${ic('back')}</button><p class="cal-month" id="cal-month">${esc(rangeLabel(days[0] < T0 ? T0 : days[0], days[days.length - 1]))}</p><button class="icon-btn" id="cal-next" data-act="cal-next" aria-label="Spätere Wochen" ${canNext ? '' : 'disabled'}>${ic('next')}</button></div>
    <div class="cal-week" aria-hidden="true">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cal-grid" role="group" aria-labelledby="cal-month">${cells}</div>
    <div class="cal-legend" aria-hidden="true"><span><i class="lg-start"></i>${F.fixedStart ? 'Heute' : 'Abholtag'}</span><span><i class="lg-ret"></i>Rückgabetag</span>${(F.busy || []).length ? '<span><i class="lg-busy"></i>Schon vergeben</span>' : ''}</div>
    ${F.calWarn || F.calInfo ? `<p class="cal-hint info" id="cal-info" role="status">${ic('info')}<span>${esc(F.calWarn || F.calInfo)}</span></p>` : ''}
    ${F.err ? `<p class="err" id="cal-err" role="alert">${esc(F.err)}</p>` : ''}
    ${calSum(F)}
  </div>`;
}
const calForm = (o = {}) => ({ who: 'member', start: null, ret: [], anchor: mondayOf(o.start && o.start > T0 ? o.start : T0), busy: [], extras: [], msg: '', focus: null, calWarn: null, err: null, ...o });
function extrasHTML(g, F) {
  const ex = expsOf(g);
  if (!ex.length) return '';
  return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px;padding:0">Erweiterungen dazu? <span class="opt">(optional)</span></legend><div class="xpicks">${ex.map(e => {
    const out = !!current(e.id) && !F.extras.includes(e.id);
    return `<label class="xpick${out ? ' is-out' : ''}"><input type="checkbox" name="xp" id="xp-${e.id}" value="${e.id}" ${F.extras.includes(e.id) ? 'checked' : ''} ${out ? 'disabled' : ''}>${coverEl(e)}<span><b>${esc(shortExp(e))}</b><span>${out ? 'Gerade verliehen' : esc(e.adds)}</span></span><span class="xcheck">${ic('check')}</span></label>`;
  }).join('')}</div></fieldset>`;
}

const pop = $('#pop');
function openPop(html, anchor, label, align = 'start') {
  if (S.popAnchor === anchor && !pop.hidden) { closePop(true); return; }
  closePop(false);
  pop.innerHTML = html; pop.hidden = false; pop.setAttribute('aria-label', label);
  S.popAnchor = anchor; anchor.setAttribute('aria-expanded', 'true');
  const r = anchor.getBoundingClientRect(), vw = document.documentElement.clientWidth, pw = pop.offsetWidth;
  let left = align === 'end' ? r.right - pw : r.left;
  left = Math.max(12, Math.min(left, vw - pw - 12));
  pop.style.left = `${left + scrollX}px`; pop.style.top = `${r.bottom + scrollY + 8}px`;
  pop.style.transformOrigin = align === 'end' ? 'top right' : 'top left';
  pop.classList.remove('in'); void pop.offsetWidth; pop.classList.add('in');
  (pop.querySelector('[aria-pressed="true"]') || pop.querySelector('button'))?.focus({ preventScroll: true });
}
function closePop(returnFocus) {
  if (pop.hidden) return;
  pop.hidden = true;

/* ---------- Hinweis mit Rückgängig ---------- */
let toastTimer = null;
function toast(msg, action) {
  const box = $('#toasts');
  box.innerHTML = `<div class="toast" role="status"><span>${esc(tidy(msg))}</span>${action ? `<button class="toast-act" id="toast-act">${esc(action.label)}</button>` : ''}</div>`;
  const el = box.querySelector('.toast');
  if (action) $('#toast-act').addEventListener('click', () => { action.run(); hideToast(); });
  const arm = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); };
  /* Hinweis bleibt stehen, solange man darauf zeigt oder ihn per Tastatur ansteuert */
  el.addEventListener('mouseenter', () => clearTimeout(toastTimer));
  el.addEventListener('mouseleave', () => arm(2500));
  el.addEventListener('focusin', () => clearTimeout(toastTimer));
  el.addEventListener('focusout', () => arm(2500));
  arm(action ? 6000 : 3200);
}
function hideToast() { const t = $('#toasts .toast'); if (!t) return; t.classList.add('out'); setTimeout(() => t.remove(), 200); }
const undoable = (obj, msg, extra) => { const snap = { ...obj, ret: obj.ret ? [...obj.ret] : obj.ret, extras: obj.extras ? [...obj.extras] : obj.extras }; toast(msg, { label: 'Rückgängig', run: () => { Object.assign(obj, snap); if (extra) extra(); refresh(); } }); };

async function shrink(file, max = 1600) {
  /* Neu kodieren über ein Canvas: verkleinert und entfernt dabei Metadaten wie den Aufnahmeort */
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return URL.createObjectURL(blob || file);
  } catch (e) { return URL.createObjectURL(file); }
}
const mb = n => `${Math.max(0.1, n / 1048576).toLocaleString('de-AT', { maximumFractionDigits: 1 })} MB`;

}

    F.err = !F.name ? 'name' : !F.contact ? 'contact' : null;
    F.errText = F.err === 'name' ? 'Bitte gib deinen Namen ein.' : F.err === 'contact' ? 'Bitte gib an, wie Jakob dich erreicht.' : null;
    if (F.err) { rerenderSheet(); $(F.err === 'name' ? '#ar-name' : '#ar-contact')?.focus(); return; }
    S.access.push({ id: 'a' + Date.now(), name: F.name, contact: F.contact, created: T0 });
    S.form = {};
    openSheet(simpleDone('Anfrage gesendet', 'Jakob meldet sich bei dir mit deinen Zugangsdaten.'));
  }
};

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('pointerdown', e => {
  if (pop.hidden) return;
  if (pop.contains(e.target) || (S.popAnchor && S.popAnchor.contains(e.target))) return;
  closePop(false);
});
let qTimer = null;
const FORM_INPUTS = { 'f-msg': 'msg', 'ph-cap': 'cap', 'lst-new': 'newList', 'gf-desc': 'desc', 'gf-rec': 'rec', 'gf-adds': 'adds', 'pf-ort': 'ort', 'pf-phone': 'phone', 'ar-name': 'name', 'ar-contact': 'contact', 'pz-brand': 'brand', 'pz-w': 'w', 'pz-h': 'h', 'pz-pieces-n': 'pieces' };
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    S.q = t.value; $('#q-clear').hidden = !t.value;
    clearTimeout(qTimer); qTimer = setTimeout(() => renderResults(false), 110);
  } else if (t.id === 'bgg-q') bggSearch(t.value);
  else if (t.id === 'pz-title') { S.form.title = t.value; if (S.form.err) { S.form.err = null; } }
  else if (t.id === 'pf-name') { S.form.name = t.value; if (S.form.mode === 'add' && !S.form.userTouched) { S.form.user = slug(t.value.replace(/^(Oma|Opa|Onkel|Tante) /i, '')); const u = $('#pf-user'); if (u) u.value = S.form.user; } }
  else if (t.id === 'pf-user') { S.form.user = t.value; S.form.userTouched = true; }
  else if (t.id === 'lg-user') { const a = $('#lg-forgot'); if (a) a.href = forgotURL(t.value.trim()); }
  else if (FORM_INPUTS[t.id]) S.form[FORM_INPUTS[t.id]] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, F = S.form;
  if (t.name === 'lend-u') { F.uid = t.value; F.err2 = null; rerenderSheet(); document.querySelector(`input[name="lend-u"][value="${t.value}"]`)?.focus({ preventScroll: true }); return; }
  if (t.name === 'give-u') { F.uid = t.value; F.err = null; rerenderSheet(); document.querySelector(`input[name="give-u"][value="${t.value}"]`)?.focus({ preventScroll: true }); return; }
  if (t.name === 'gf-once') { F.once = t.value === 'none' ? null : t.value; if (!F.once) F.done = false; rerenderSheet(); document.querySelector(`input[name="gf-once"][value="${t.value}"]`)?.focus({ preventScroll: true }); return; }
  if (t.name === 'rp-mode') { F.mode = t.value; rerenderSheet(); document.querySelector(`input[name="rp-mode"][value="${t.value}"]`)?.focus({ preventScroll: true }); return; }
  if (t.name === 'xp') { F.extras = t.checked ? [...F.extras, t.value] : F.extras.filter(x => x !== t.value); F.busy = busyOf([F.gid, ...F.extras], F.loanId); rerenderSheet(); return; }
  if (t.name === 'lst') { const li = myLists().find(x => x.id === t.value), gid = S.sheetView && $('#lst-add')?.dataset.id; if (li && gid) { li.ids = t.checked ? [...li.ids, gid] : li.ids.filter(x => x !== gid); rerenderSheet(); refresh(); } return; }
  if (t.name === 'cat') { S.cat[t.value] = t.checked; rerenderSheet(); return; }
  if (t.id === 'gf-base') { F.base = t.value; F.errBase = null; return; }
  if (t.id === 'gf-rules' && t.files?.[0]) { const f = t.files[0]; F.rules = { lang: F.rules?.lang || (F.lang === 'en' ? 'Englisch' : 'Deutsch'), size: mb(f.size), name: f.name }; rerenderSheet(); return; }
  if (t.id === 'pz-img' && t.files?.[0]) { const f = t.files[0], form = F; shrink(f, 1200).then(url => { if (S.form !== form) return; form.img = url; rerenderSheet(); }); return; }
  if (t.id === 'ph-in' && t.files?.length) {
    const files = [...t.files].filter(f => f.type.startsWith('image/')).slice(0, 12), form = F, start = form.photos.length;
    files.forEach(() => form.photos.push({ busy: true }));
    form.err = null; rerenderSheet();
    files.forEach((f, k) => shrink(f).then(url => { if (S.form !== form) return; form.photos[start + k] = { url }; rerenderSheet(); }));
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'pw-form') {
    e.preventDefault();
    const p1 = $('#np1').value, p2 = $('#np2').value, err = $('#np-err');
    const msg = p1.length < 8 ? 'Bitte wähl ein Passwort mit mindestens 8 Zeichen.' : p1 !== p2 ? 'Die beiden Passwörter stimmen nicht überein.' : '';
    if (msg) { err.textContent = msg; err.hidden = false; (p1.length < 8 ? $('#np1') : $('#np2')).focus(); return; }
    me().mustChange = false; renderApp(); scrollTo(0, 0); toast('Passwort gespeichert. Viel Spaß beim Stöbern!');
    return;
  }
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const name = $('#lg-user').value.trim().toLowerCase(), err = $('#lg-err');
  if (!name) { err.textContent = 'Bitte gib deinen Benutzernamen ein.'; err.hidden = false; $('#lg-user').focus(); return; }
  const u = S.users.find(x => x.username === name);
  if (!u) { err.textContent = 'Benutzername oder Passwort stimmt nicht.'; err.hidden = false; $('#lg-user').focus(); return; }
  S.user = u.id; S.view = 'app'; S.tab = 'regal'; resetMode(); renderApp(); scrollTo(0, 0);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!pop.hidden) { closePop(true); e.preventDefault(); }
    else if (sheetOpen()) { closeSheet(); e.preventDefault(); }
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'bgg-q') { e.preventDefault(); return; }
  if (e.key === 'Enter' && e.target.id === 'lst-new') { e.preventDefault(); $('#lst-add')?.click(); return; }
  /* Kalender: Pfeiltasten springen zum nächsten wählbaren Tag */
  if (e.target.classList?.contains('cal-day') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault();
    const F = S.form, step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    const d = addDays(parseISO(e.target.dataset.d), step);
    if (d < T0 || dnum(d) > DAYS_AHEAD + 34) return;
    F.focus = d; F.calInfo = null;
    if (d < F.anchor) F.anchor = mondayOf(d);
    if (d > addDays(F.anchor, WEEKS * 7 - 1)) F.anchor = addDays(mondayOf(d), -7 * (WEEKS - 1));
    rerenderSheet(); $(`#cd-${isoD(d)}`)?.focus({ preventScroll: true });
    return;
  }
  if (e.key === 'Tab' && !pop.hidden && pop.contains(document.activeElement)) {
    const f = [...pop.querySelectorAll('button')], first = f[0], last = f[f.length - 1], a = S.popAnchor;
    if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); closePop(false);
      const all = [...document.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),textarea,select')].filter(el => el.offsetParent !== null && !pop.contains(el));
      (all[all.indexOf(a) + 1] || a)?.focus();
    } else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); closePop(true); }
    return;
  }
  if (e.key === 'Tab' && sheetOpen()) {
    const f = [...sheetPanel.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),textarea,select,[tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null || el.type === 'file');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !sheetPanel.contains(document.activeElement))) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});
addEventListener('scroll', () => {
  const tb = $('#topbar'); if (tb) tb.classList.toggle('scrolled', scrollY > 4);
  if (!pop.hidden && S.popAnchor && S.popAnchor.closest('.topbar')) closePop(false);
}, { passive: true });
let lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth !== lastW) { lastW = innerWidth; closePop(false); } if (sheetOpen()) footEdge(); });
/* Popup schließt, wenn der Fokus per Tastatur woanders hin wandert (Klicks regelt pointerdown) */
pop.addEventListener('focusout', e => { const to = e.relatedTarget; if (to && !pop.contains(to) && to !== S.popAnchor) closePop(false); });
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'chips') closePop(false); }, true);
document.addEventListener('focusin', e => { if (!pop.hidden && !pop.contains(e.target) && e.target !== S.popAnchor) closePop(false); });
document.documentElement.lang = 'de-AT';
renderApp();
})();
